          f2-platform/1.2.1-2026-05-15-22-00-06/core/320f7374f7eaae6eb7297b024d7d53bc
      Timeout: 30
      MemorySize: 512
      Layers:
      - Ref: CommonLayer
      Role:
        Fn::GetAtt:
        - AwsInvokerLambdaRole
        - Arn
  AwsInvokerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: f2-core-aws-invoker-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
      Policies:
      - PolicyName:
          Fn::Sub: f2-aws-invoker-bedrock-policy-${Environment}
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - bedrock:StartIngestionJob
            - bedrock:GetIngestionJob
            Resource:
              Fn::Sub: 
                arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
          - Effect: Allow
            Action:
            - bedrock:ListFoundationModels
            - bedrock:ListAgentActionGroups
            - bedrock:GetAgentActionGroup
            - bedrock:ListAgentCollaborators
            - bedrock:GetAgent
            - bedrock:ListAgentKnowledgeBases
            - bedrock:AssociateAgentKnowledgeBase
            - bedrock:UpdateAgentKnowledgeBase
            - bedrock:DisassociateAgentKnowledgeBase
            - bedrock:CreateAgentActionGroup
            - bedrock:UpdateAgentActionGroup
            - bedrock:DeleteAgentActionGroup
            - bedrock:AssociateAgentCollaborator
            - bedrock:UpdateAgentCollaborator
            - bedrock:DisassociateAgentCollaborator
            Resource: '*'
  CommonLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName:
        Fn::Sub: f2-core-common-layer-${Environment}
      Description: Common layer
      Content:
        S3Bucket: f2-cf-artifacts
        S3Key: 
          f2-platform/1.2.1-2026-05-15-22-00-06/core/6a9e9fb9d9144bab309ffce8e62b2f80
      CompatibleRuntimes:
      - Fn::FindInMap:
        - StaticValues
        - F2core
        - LambdaRuntime
  CoreApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name:
        Fn::Sub: f2-api-${Environment}
      Description: Core API for f2 application
      EndpointConfiguration:
        Types:
        - REGIONAL
  ApiGatewayLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: f2-core-lambda-execution-api-gateway-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - apigateway.amazonaws.com
          Action:
          - sts:AssumeRole
      Policies:
      - PolicyName: InvokeCoreLambdaPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:InvokeFunction
            Resource:
            - Fn::GetAtt:
              - JwtTokenAuthorizerLambda
              - Arn
            - Fn::GetAtt:
              - SharedTokenAuthorizerLambda
              - Arn
            - Fn::GetAtt:
              - AwsInvokerLambda
              - Arn
            - Fn::GetAtt:
              - DBProxyLambda
              - Arn
            - Fn::GetAtt:
              - ForgotPasswordLambda
              - Arn
            - Fn::GetAtt:
              - ResetPasswordLambda
              - Arn
            - Fn::GetAtt:
              - SearchPostLambda
              - Arn
            - Fn::GetAtt:
              - UserDeleteLambda
              - Arn
            - Fn::GetAtt:
              - UserPostLambda
              - Arn
  ApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName:
        Fn::FindInMap:
        - StaticValues
        - F2core
        - StageName
      Description: Stage for Core API
      RestApiId:
        Ref: CoreApi
      DeploymentId:
        Ref: CoreApiDeployment
  CoreApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
    - PutUserApiMethod
    - GetUserApiMethod
    - GetAccountListApiMethod
    - PostTokenApiMethod
    Properties:
      RestApiId:
        Ref: CoreApi
      Description:
        Fn::Sub:
        - "Deployed api nested stacks:\nVersion = ${Version}\nCX     = ${CxId}\n"
        - CxId:
            Fn::If:
            - ShouldDeployCxStack
            - CxStack
            - 'OFF'
          Version:
            Fn::FindInMap:
            - StaticValues
            - F2core
            - Version
  UtilApiRedeploymentLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Fn::Sub: f2-clf-util-api-redeployment-${Environment}
      Runtime:
        Fn::FindInMap:
        - StaticValues
        - F2core
        - LambdaRuntime
      Handler: index.handler
      Code:
        S3Bucket: f2-cf-artifacts
        S3Key: 
          f2-platform/1.2.1-2026-05-15-22-00-06/core/b9229413f4f36b3ca48d543355e9879f
      Layers:
      - Ref: CommonLayer
      Timeout: 60
      MemorySize: 512
      Role:
        Fn::GetAtt:
        - UtilApiRedeploymentLambdaRole
        - Arn
  UtilApiRedeploymentLambdaVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName:
        Ref: UtilApiRedeploymentLambda
  UtilApiRedeploymentLambdaEventConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName:
        Ref: UtilApiRedeploymentLambda
      MaximumRetryAttempts: 0
      Qualifier:
        Fn::GetAtt:
        - UtilApiRedeploymentLambdaVersion
        - Version
  UtilApiRedeploymentLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: f2-util-api-redeployment-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName:
          Fn::Sub: f2-Lambda-ApiGateway-Deployment-Policy-${Environment}
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - apigateway:CreateDeployment
            - apigateway:POST
            Resource:
              Fn::Sub: 
                arn:aws:apigateway:${AWS::Region}::/restapis/${CoreApi}/deployments
          - Effect: Allow
            Action:
            - apigateway:UpdateStage
            - apigateway:PATCH
            Resource:
              Fn::Sub: 
                arn:aws:apigateway:${AWS::Region}::/restapis/${CoreApi}/stages/${ApiGatewayStage}
          - Effect: Allow
            Action:
            - apigateway:GET
            Resource:
              Fn::Sub: 
                arn:aws:apigateway:${AWS::Region}::/restapis/${CoreApi}/stages/${ApiGatewayStage}/exports/oas30
          - Effect: Allow
            Action:
            - apigateway:GetExport
            Resource:
              Fn::Sub: 
                arn:aws:apigateway:${AWS::Region}::/restapis/${CoreApi}/stages/${ApiGatewayStage}
      - PolicyName:
          Fn::Sub: f2-Lambda-S3-Cloudfront-Deployment-Policy-${Environment}
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:PutObject
            - s3:DeleteObject
            Resource:
              Fn::Sub: arn:aws:s3:::${CoreBucket}/*
          - Fn::If:
            - ShouldDeployWebUiStack
            - Effect: Allow
              Action:
              - cloudfront:CreateInvalidation
              Resource:
                Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/*
            - Ref: AWS::NoValue
  InvokeUtilApiRedeploymentLambda:
    Type: Custom::ApiRedeployment
    DependsOn:
    - DBProxyLambda
    - AwsInvokerLambda
    - JwtTokenAuthorizerLambda
    - SharedTokenAuthorizerLambda
    - UtilApiRedeploymentLambda
    - GetAccountListApiMethod
    - GetUserApiMethod
    - PostTokenApiMethod
    - PutUserApiMethod
    - PostUserApiMethod
    - PatchUserApiMethod
    Properties:
      ServiceToken:
        Fn::GetAtt:
        - UtilApiRedeploymentLambda
        - Arn
      RestApiId:
        Ref: CoreApi
      StageName:
        Ref: ApiGatewayStage
      Version:
        Fn::FindInMap:
        - StaticValues
        - F2core
        - Version
      S3BucketName:
        Ref: CoreBucket
      S3ObjectKey: swagger/swagger.json
      CloudFrontDistributionId: 'OFF'
      Description:
      - "Deployed modules:\nCX_MODULE_NAME = ${CxModuleName}\nCX_METHODS = ${CxMethods}\n\
        \nAI_MODULE_NAME = ${AiModuleName}\nAI_METHODS = ${AiMethods}\n\nCMS_MODULE_NAME
        = ${CmsModuleName}\n"
      - CxMethods:
          Fn::If:
          - ShouldDeployCxStack
          - Fn::GetAtt:
            - CxStack
            - Outputs.ApiMethods
          - 'OFF'
        AiMethods:
          Fn::GetAtt:
          - AiStack
          - Outputs.ApiMethods
        CxModuleName:
          Fn::If:
          - ShouldDeployCxStack
          - Fn::GetAtt:
            - CxStack
            - Outputs.ModuleName
          - 'OFF'
        AiModuleName:
          Fn::GetAtt:
          - AiStack
          - Outputs.ModuleName
        CmsModuleName:
          Fn::If:
          - ShouldDeployCmsStack
          - Fn::GetAtt:
            - CmsStack
            - Outputs.ModuleName
          - 'OFF'
  ModifyRdsDeleteProtectionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Fn::Sub: f2-clf-modify-rds-delete-protection-${Environment}
      Runtime:
        Fn::FindInMap:
        - StaticValues
        - F2core
        - LambdaRuntime
      Handler: index.handler
      Code:
        S3Bucket: f2-cf-artifacts
        S3Key: 
          f2-platform/1.2.1-2026-05-15-22-00-06/core/cd5327f1f183f4cfd71510bc48471bc6
      Layers:
      - Ref: CommonLayer
      Timeout: 60
      MemorySize: 512
      Role:
        Fn::GetAtt:
        - ModifyRdsDeleteProtectionLambdaRole
        - Arn
  ModifyRdsDeleteProtectionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: f2-clf-modify-rds-delete-protection-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: ModifyRDSClusterDeletionProtection
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - rds:ModifyDBCluster
            Resource:
              Fn::GetAtt:
              - RdsStack
              - Outputs.RdsClusterArn
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  ModifyRdsDeleteProtection:
    Type: Custom::ModifyRdsDeleteProtection
    DependsOn:
    - InvokeUtilApiRedeploymentLambda
    Properties:
      ServiceToken:
        Fn::GetAtt:
        - ModifyRdsDeleteProtectionLambda
        - Arn
      ClusterIdentifier:
        Fn::GetAtt:
        - RdsStack
        - Outputs.RdsClusterId
  EmptyS3BucketLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Fn::Sub: f2-clf-empty-s3-bucket-${Environment}
      Runtime:
        Fn::FindInMap:
        - StaticValues
        - F2core
        - LambdaRuntime
      Handler: index.handler
      Code:
        S3Bucket: f2-cf-artifacts
        S3Key: 
          f2-platform/1.2.1-2026-05-15-22-00-06/core/762cee79e0d5fe136f27230d69102f4e
      Layers:
      - Ref: CommonLayer
      Timeout: 60
      MemorySize: 512
      Role:
        Fn::GetAtt:
        - EmptyS3BucketLambdaRole
        - Arn
  EmptyS3BucketLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: f2-clf-empty-s3-bucket-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName:
          Fn::Sub: f2-empty-core-s3-bucket-role-policy-${Environment}
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:DeleteObject
            - s3:ListBucket
            - s3:GetBucketVersioning
            - s3:DeleteObjectVersion
            - s3:ListBucketVersions
            Resource:
            - Fn::GetAtt:
              - CoreBucket
              - Arn
            - Fn::Sub: ${CoreBucket.Arn}/*
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  EmptyCoreS3Bucket:
    Type: Custom::EmptyCoreS3Bucket
    Properties:
      ServiceToken:
        Fn::GetAtt:
        - EmptyS3BucketLambda
        - Arn
      BucketName:
        Ref: CoreBucket
  CreateDefaultAdminLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: f2-clf-create-default-admin-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
      - Ref: JwtAuthorizerSecretGetPolicy
  CreateDefaultAdminLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Fn::Sub: f2-clf-create-default-admin-${Environment}
      Handler: index.handler
      Role:
        Fn::GetAtt:
        - CreateDefaultAdminLambdaRole
        - Arn
      Runtime:
        Fn::FindInMap:
        - StaticValues
        - F2core
        - LambdaRuntime
      Code:
        S3Bucket: f2-cf-artifacts
        S3Key: 
          f2-platform/1.2.1-2026-05-15-22-00-06/core/09866a7919ef7925869153c6254501ae
      Layers:
      - Ref: CommonLayer
      Timeout: 60
      VpcConfig:
        SubnetIds:
          Fn::If:
          - ExistingVpcSelected
          - Ref: SubnetsToLambda
          - Fn::Split:
            - ','
            - Fn::GetAtt:
              - VpcStack
              - Outputs.PrivateSubnetIds
        SecurityGroupIds:
        - Fn::GetAtt:
          - VpcStack
          - Outputs.CoreAppSecurityGroup
      Environment:
        Variables:
          ENVIRONMENT:
            Ref: Environment
          JWT_AUTHORIZER_SECRET:
            Fn::FindInMap:
            - EnvironmentMap
            - Ref: Environment
            - JwtSecretName
          DB_API_URL:
            Fn::GetAtt:
            - Ec2Stack
            - Outputs.LoadBalancerLink
  CreateDefaultAdminTrigger:
    Type: Custom::CreateDefaultAdmin
    DependsOn:
    - JwtAuthorizerSecret
    Properties:
      ServiceTimeout: 70
      ServiceToken:
        Fn::GetAtt:
        - CreateDefaultAdminLambda
        - Arn
      AdminEmail:
        Ref: DefaultAdminEmail
      AdminPassword:
        Ref: DefaultAdminPassword
Outputs:
  PlatformVersion:
    Description: The version of the platform
    Value:
      Fn::FindInMap:
      - StaticValues
      - F2core
      - Version
  F2ApiUrl:
    Description: API Gateway Invoke URL
    Value:
      Fn::Sub: 
        https://${CoreApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiGatewayStage}
  F2PortalBucketName:
    Condition: ShouldDeployWebUiStack
    Description: F2 Portal bucket name for CloudFront
    Value:
      Fn::Sub:
      - ${CoreBucket}/${PortalFolder}
      - PortalFolder:
          Fn::FindInMap:
          - StaticValues
          - F2core
          - PortalFolder
  F2PortalUrl:
    Condition: ShouldDeployWebUiStack
    Description: Portal CloudFront URL
    Value:
      Fn::Sub:
      - https://${DomainName}
      - DomainName:
          Fn::GetAtt:
          - WebUIStack
          - Outputs.CloudFrontPortalDomain
  F2PortalDistributionId:
    Condition: ShouldDeployWebUiStack
    Description: Portal CloudFront Distribution Id
    Value:
      Fn::GetAtt:
      - WebUIStack
      - Outputs.DistributionF2PortalId
