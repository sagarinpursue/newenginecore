AWSTemplateFormatVersion: 2010-09-09
Description: The Main CloudFormation Template for F2 platform 1.2.1
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - prod
    - stage
    Description: The environment suffix to create f2 resources with. This is 
      only used to name resources and has no effect on behavior.
  PostgresVersion:
    Type: String
    Description: The version of the Postgres database
    Default: '17.5'
  MaxRdsCapacity:
    Type: Number
    Description: The maximum number capacity of RDS Cluster
    Default: 2
    MinValue: 1
  ExistingVpc:
    Type: String
    Description: ID of the existing VPC to deploy f2 infrastructure into. (leave
      empty to create a new one)
    Default: ''
  SubnetsToRDS:
    Type: CommaDelimitedList
    Description: List ID of the exiting subnets to RDS
    Default: ''
  SubnetsToEC2:
    Type: CommaDelimitedList
    Description: List ID of the exiting subnets to EC2
    Default: ''
  SubnetsToLambda:
    Type: CommaDelimitedList
    Description: List ID of the exiting subnets to Lambda
    Default: ''
  ApiServiceInstanceType:
    Type: String
    Description: Select EC2 instance type for API server
    Default: t3a.small
  KmsKeyId:
    Type: String
    Description: ARN or ID existing KMS key for encryption ebs in ec2.(Optional)
    Default: ''
  DeployWebUi:
    Type: String
    Default: false
    AllowedValues:
    - true
    - false
    Description: Whether to deploy the Web UI nested stack (set to "true" to 
      include it).
  DeployCxStack:
    Type: String
    Default: false
    AllowedValues:
    - true
    - false
    Description: Whether to deploy the CX nested stack (set to "true" to include
      it).
  DeployCmsStack:
    Type: String
    Default: false
    AllowedValues:
    - true
    - false
    Description: Whether to deploy the CMS module (set to "true" to include it).
  DefaultAdminEmail:
    Type: String
    Description: Default admin email address for the F2 platform
  DefaultAdminPassword:
    Type: String
    Description: Default admin password for the F2 platform
    MinLength: 12
    NoEcho: true
    AllowedPattern: ^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: General Configuration
      Parameters:
      - Environment
      - DefaultAdminEmail
      - DefaultAdminPassword
    - Label:
        default: RDS Configuration
      Parameters:
      - PostgresVersion
      - MaxRdsCapacity
    - Label:
        default: Existing VPC Configuration
      Parameters:
      - ExistingVpc
      - SubnetsToRDS
      - SubnetsToEC2
      - SubnetsToLambda
    - Label:
        default: EC2 Configuration
      Parameters:
      - ApiServiceInstanceType
      - KmsKeyId
    - Label:
        default: Deploy Additional Modules
      Parameters:
      - DeployWebUi
      - DeployCxStack
      - DeployCmsStack
Conditions:
  ShouldDeployWebUiStack:
    Fn::Equals:
    - Ref: DeployWebUi
    - 'true'
  ShouldDeployCxStack:
    Fn::Equals:
    - Ref: DeployCxStack
    - 'true'
  ShouldDeployCmsStack:
    Fn::Equals:
    - Ref: DeployCmsStack
    - 'true'
  ExistingVpcSelected:
    Fn::Not:
    - Fn::Equals:
      - Ref: ExistingVpc
      - ''
Mappings:
  StaticValues:
    F2core:
      LambdaRuntime: nodejs22.x
      StageName: f2-api
      Version: 1.2.1
      CoreBucketCmsTempFolder: cms-temporary-documents
      PortalFolder: web-ui
  RegionMap:
    us-east-1:
      ArtifactBucket: f2-platform-artifacts-us-east-1-dev
    eu-west-1:
      ArtifactBucket: f2-platform-artifacts-eu-west-1-dev
    us-west-2:
      ArtifactBucket: f2-platform-artifacts-us-west-2-dev
  EnvironmentMap:
    prod:
      JwtSecretName: f2-prod/auth/jwt
    stage:
      JwtSecretName: f2-stage/auth/jwt
    dev:
      JwtSecretName: f2-dev/auth/jwt
Resources:
  VpcStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/f2-cf-artifacts/f2-platform/1.2.1-2026-05-15-22-00-06/core/2ce822b0a9bd8854a95b16fe3c2ff3bb.template
      Parameters:
        Version:
          Fn::FindInMap:
          - StaticValues
          - F2core
          - Version
        Environment:
          Ref: Environment
        CustomerVpc:
          Ref: ExistingVpc
  RdsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/f2-cf-artifacts/f2-platform/1.2.1-2026-05-15-22-00-06/core/cb74d281213101ad5f27df64119d4c04.template
      Parameters:
        Environment:
          Ref: Environment
        PostgresVersion:
          Ref: PostgresVersion
        MaxCapacity:
          Ref: MaxRdsCapacity
        Version:
          Fn::FindInMap:
          - StaticValues
          - F2core
          - Version
        VPC:
          Fn::GetAtt:
          - VpcStack
          - Outputs.VPC
        RdsSubnetIds:
          Fn::If:
          - ExistingVpcSelected
          - Fn::Join:
            - ','
            - Ref: SubnetsToRDS
          - Fn::GetAtt:
            - VpcStack
            - Outputs.PrivateSubnetIds
        LambdaSubnetIds:
          Fn::If:
          - ExistingVpcSelected
          - Fn::Join:
            - ','
            - Ref: SubnetsToLambda
          - Fn::GetAtt:
            - VpcStack
            - Outputs.PrivateSubnetIds
        RdsSecurityGroup:
          Fn::GetAtt:
          - VpcStack
          - Outputs.RdsSecurityGroup
        APIServiceSecurityGroup:
          Fn::GetAtt:
          - VpcStack
          - Outputs.APIServiceSecurityGroup
        CommonLayer:
          Ref: CommonLayer
        LambdaRuntime:
          Fn::FindInMap:
          - StaticValues
          - F2core
          - LambdaRuntime
  Ec2Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/f2-cf-artifacts/f2-platform/1.2.1-2026-05-15-22-00-06/core/305dbe9d03d509ec8bb6bce7f46c7ed1.template
      Parameters:
        Environment:
          Ref: Environment
        PrivateBucketName:
          Ref: CoreBucket
        Version:
          Fn::FindInMap:
          - StaticValues
          - F2core
          - Version
        VPC:
          Fn::GetAtt:
          - VpcStack
          - Outputs.VPC
        PrivateSubnetIds:
          Fn::If:
          - ExistingVpcSelected
          - Fn::Join:
            - ','
            - Ref: SubnetsToEC2
          - Fn::GetAtt:
            - VpcStack
            - Outputs.PrivateSubnetIds
        APIServiceSecurityGroup:
          Fn::GetAtt:
          - VpcStack
          - Outputs.APIServiceSecurityGroup
        AlbSecurityGroup:
          Fn::GetAtt:
          - VpcStack
          - Outputs.AlbSecurityGroup
        JwtAuthorizerSecret:
          Fn::FindInMap:
          - EnvironmentMap
          - Ref: Environment
          - JwtSecretName
        MasterCredentialsSecret:
          Fn::GetAtt:
          - RdsStack
          - Outputs.MasterCredentialsSecret
        RdsClusterEndpoint:
          Fn::GetAtt:
          - RdsStack
          - Outputs.RdsClusterEndpoint
        RdsClusterPort:
          Fn::GetAtt:
          - RdsStack
          - Outputs.RdsClusterPort
        CommonLayer:
          Ref: CommonLayer
        LambdaRuntime:
          Fn::FindInMap:
          - StaticValues
          - F2core
          - LambdaRuntime
        InstanceType:
          Ref: ApiServiceInstanceType
        KmsKeyId:
          Ref: KmsKeyId
  WebUIStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployWebUiStack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/f2-cf-artifacts/f2-platform/1.2.1-2026-05-15-22-00-06/core/999d4bf8966ef52f73d26aa9bf04fdd1.template
      Parameters:
        Environment:
          Ref: Environment
        Version:
          Fn::FindInMap:
          - StaticValues
          - F2core
          - Version
        PrivateBucketName:
          Ref: CoreBucket
        PortalFolder:
          Fn::FindInMap:
          - StaticValues
          - F2core
          - PortalFolder
  CxStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployCxStack
    DependsOn:
    - AiStack
    Properties:
      TemplateURL:
        Fn::Sub:
        - https://s3.${AWS::Region}.amazonaws.com/${ArtifactBucket}/f2-platform/${Version}/cx/template.yaml
        - Version:
            Fn::FindInMap:
            - StaticValues
            - F2core
            - Version
          ArtifactBucket:
            Fn::FindInMap:
            - RegionMap
            - Ref: AWS::Region
            - ArtifactBucket
      Parameters:
        Environment:
          Ref: Environment
        VPC:
          Fn::GetAtt:
          - VpcStack
          - Outputs.VPC
        PrivateSubnetIds:
          Fn::If:
          - ExistingVpcSelected
          - Fn::Join:
            - ','
            - Ref: SubnetsToLambda
          - Fn::GetAtt:
            - VpcStack
            - Outputs.PrivateSubnetIds
        SecurityGroup:
          Fn::GetAtt:
          - VpcStack
          - Outputs.CoreAppSecurityGroup
        PrivateBucketName:
          Ref: CoreBucket
        Version:
          Fn::FindInMap:
          - StaticValues
          - F2core
          - Version
        CoreApi:
          Ref: CoreApi
        CoreApiRootResourceId:
          Fn::GetAtt:
          - CoreApi
          - RootResourceId
        ApiGatewayStage:
          Ref: ApiGatewayStage
        WebhookResourceId:
          Ref: WebhookResource
        JwtTokenAuthorizer:
          Ref: JwtTokenAuthorizer
        DBProxyLambdaArn:
          Fn::GetAtt:
          - DBProxyLambda
          - Arn
        AwsInvokerLambdaArn:
          Fn::GetAtt:
          - AwsInvokerLambda
          - Arn
        DatabaseApiUrl:
          Fn::GetAtt:
          - Ec2Stack
          - Outputs.LoadBalancerLink
        JwtAuthorizerSecret:
          Fn::FindInMap:
          - EnvironmentMap
          - Ref: Environment
          - JwtSecretName
        JwtAuthorizerSecretGetPolicy:
          Ref: JwtAuthorizerSecretGetPolicy
        CommonLayer:
          Ref: CommonLayer
        LambdaRuntime:
          Fn::FindInMap:
          - StaticValues
          - F2core
          - LambdaRuntime
        MigrationDbScriptLambda:
          Fn::GetAtt:
          - RdsStack
          - Outputs.MigrationDbScriptLambda
        ApiGatewayLambdaExecutionRole:
          Fn::GetAtt:
          - ApiGatewayLambdaExecutionRole
          - Arn
  AiStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/f2-cf-artifacts/f2-platform/1.2.1-2026-05-15-22-00-06/core/12b74c29623999283bfc39212af34b8f.template
      Parameters:
        Environment:
          Ref: Environment
        CoreVPC:
          Fn::GetAtt:
          - VpcStack
          - Outputs.VPC
        PrivateSubnetIds:
          Fn::If:
          - ExistingVpcSelected
          - Fn::Join:
            - ','
            - Ref: SubnetsToLambda
          - Fn::GetAtt:
            - VpcStack
            - Outputs.PrivateSubnetIds
        SecurityGroup:
          Fn::GetAtt:
          - VpcStack
          - Outputs.CoreAppSecurityGroup
        Version:
          Fn::FindInMap:
          - StaticValues
          - F2core
          - Version
        LoadBalancerLink:
          Fn::GetAtt:
          - Ec2Stack
          - Outputs.LoadBalancerLink
        JwtAuthorizerSecret:
          Fn::FindInMap:
          - EnvironmentMap
          - Ref: Environment
          - JwtSecretName
        JwtAuthorizerSecretGetPolicy:
          Ref: JwtAuthorizerSecretGetPolicy
        CommonLayer:
          Ref: CommonLayer
        LambdaRuntime:
          Fn::FindInMap:
          - StaticValues
          - F2core
          - LambdaRuntime
        CoreApi:
          Ref: CoreApi
        CoreApiRootResourceId:
          Fn::GetAtt:
          - CoreApi
          - RootResourceId
        ApiGatewayStage:
          Ref: ApiGatewayStage
        PrivateBucketName:
          Ref: CoreBucket
        JwtTokenAuthorizer:
          Ref: JwtTokenAuthorizer
        SharedTokenAuthorizer:
          Ref: SharedTokenAuthorizer
        DBProxyLambdaArn:
          Fn::GetAtt:
          - DBProxyLambda
          - Arn
        AwsInvokerLambdaArn:
          Fn::GetAtt:
          - AwsInvokerLambda
          - Arn
        MigrationDbScriptLambda:
          Fn::GetAtt:
          - RdsStack
          - Outputs.MigrationDbScriptLambda
        ApiGatewayLambdaExecutionRole:
          Fn::GetAtt:
          - ApiGatewayLambdaExecutionRole
          - Arn
  CmsStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployCmsStack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/f2-cf-artifacts/f2-platform/1.2.1-2026-05-15-22-00-06/core/52c843c90286bbd1ec6243a664d1f904.template
      Parameters:
        Environment:
          Ref: Environment
        CoreVPC:
          Fn::GetAtt:
          - VpcStack
          - Outputs.VPC
        PrivateSubnetIds:
          Fn::If:
          - ExistingVpcSelected
          - Fn::Join:
            - ','
            - Ref: SubnetsToLambda
          - Fn::GetAtt:
            - VpcStack
            - Outputs.PrivateSubnetIds
        SecurityGroup:
          Fn::GetAtt:
          - VpcStack
          - Outputs.CoreAppSecurityGroup
        Version:
          Fn::FindInMap:
          - StaticValues
          - F2core
          - Version
        DatabaseApiUrl:
          Fn::GetAtt:
          - Ec2Stack
          - Outputs.LoadBalancerLink
        JwtAuthorizerSecret:
          Fn::FindInMap:
          - EnvironmentMap
          - Ref: Environment
          - JwtSecretName
        JwtAuthorizerSecretGetPolicy:
          Ref: JwtAuthorizerSecretGetPolicy
        CommonLayer:
          Ref: CommonLayer
        LambdaRuntime:
          Fn::FindInMap:
          - StaticValues
          - F2core
          - LambdaRuntime
        CoreApi:
          Ref: CoreApi
        CoreApiRootResourceId:
          Fn::GetAtt:
          - CoreApi
          - RootResourceId
        CoreBucket:
          Ref: CoreBucket
        CoreBucketCmsTempFolder:
          Fn::FindInMap:
          - StaticValues
          - F2core
          - CoreBucketCmsTempFolder
        JwtTokenAuthorizer:
          Ref: JwtTokenAuthorizer
        ApiGatewayLambdaExecutionRole:
          Fn::GetAtt:
          - ApiGatewayLambdaExecutionRole
          - Arn
        MigrationDbScriptLambda:
          Fn::GetAtt:
          - RdsStack
          - Outputs.MigrationDbScriptLambda
        EmptyS3BucketLambda:
          Fn::GetAtt:
          - EmptyS3BucketLambda
          - Arn
        EmptyS3BucketLambdaRole:
          Fn::GetAtt:
          - EmptyS3BucketLambdaRole
          - Arn
  JwtAuthorizerSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::FindInMap:
        - EnvironmentMap
        - Ref: Environment
        - JwtSecretName
      GenerateSecretString:
        GenerateStringKey: jwtSecret
        ExcludeCharacters: "%+~`#$&*()|[]{}:;<>?!'/@\"\\"
        PasswordLength: 40
        SecretStringTemplate: '{"anonKey":"","serviceRoleKey":""}'
  GenerateJwtKeyLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: f2-clf-generate-jwt-keys-script-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: LambdaSecretsPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:UpdateSecret
            Resource:
              Ref: JwtAuthorizerSecret
  GenerateJwtKeyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Fn::Sub: f2-clf-generate-jwt-keys-script-${Environment}
      Handler: index.handler
      Role:
        Fn::GetAtt:
        - GenerateJwtKeyLambdaExecutionRole
        - Arn
      Runtime:
        Fn::FindInMap:
        - StaticValues
        - F2core
        - LambdaRuntime
      Layers:
      - Ref: CommonLayer
      Timeout: 60
      Environment:
        Variables:
          ENVIRONMENT:
            Ref: Environment
          JWT_AUTHORIZER_SECRET:
            Fn::FindInMap:
            - EnvironmentMap
            - Ref: Environment
            - JwtSecretName
      Code:
        S3Bucket: f2-cf-artifacts
        S3Key: 
          f2-platform/1.2.1-2026-05-15-22-00-06/core/b8c2c45c4bb66184fb6250965242979d
  GenerateJwtKeyTrigger:
    Type: Custom::GenerateJwtKey
    Properties:
      ServiceTimeout: 70
      ServiceToken:
        Fn::GetAtt:
        - GenerateJwtKeyLambda
        - Arn
      JwtAuthorizerSecretArn:
        Ref: JwtAuthorizerSecret
  JwtAuthorizerSecretGetPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: f2-core-jwt-authorizer-secret-get-policy-${Environment}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtAuthorizerSecret
  CoreBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub:
        - f2-platform-${UniqueId}-${Environment}
        - UniqueId:
            Fn::Select:
            - 2
            - Fn::Split:
              - /
              - Ref: AWS::StackId
      AccessControl: Private
      LifecycleConfiguration:
        Fn::If:
        - ShouldDeployCmsStack
        - Rules:
          - Id: ClearTemporaryDocumentsToFolderCms
            Status: Enabled
            Prefix:
              Fn::Sub:
              - ${CmsTempFolder}/
              - CmsTempFolder:
                  Fn::FindInMap:
                  - StaticValues
                  - F2core
                  - CoreBucketCmsTempFolder
            ExpirationInDays: 1
        - Ref: AWS::NoValue
      CorsConfiguration:
        Fn::If:
        - ShouldDeployCmsStack
        - CorsRules:
          - AllowedHeaders:
            - '*'
            AllowedMethods:
            - PUT
            AllowedOrigins:
            - http://localhost:4200
            - https://*.cloudfront.net
        - Ref: AWS::NoValue
  DBProxyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: f2-core-db-api-proxy-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
      - Ref: JwtAuthorizerSecretGetPolicy
  DBProxyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Fn::Sub: f2-core-db-api-proxy-${Environment}
      Runtime:
        Fn::FindInMap:
        - StaticValues
        - F2core
        - LambdaRuntime
      Handler: index.handler
      Code:
        S3Bucket: f2-cf-artifacts
        S3Key: 
          f2-platform/1.2.1-2026-05-15-22-00-06/core/45d253943e4387ec9bc7e1e793c39669
      Layers:
      - Ref: CommonLayer
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT:
            Ref: Environment
          DB_API_URL:
            Fn::GetAtt:
            - Ec2Stack
            - Outputs.LoadBalancerLink
          JWT_AUTHORIZER_SECRET:
            Fn::FindInMap:
            - EnvironmentMap
            - Ref: Environment
            - JwtSecretName
      Role:
        Fn::GetAtt:
        - DBProxyLambdaRole
        - Arn
      VpcConfig:
        SubnetIds:
          Fn::If:
          - ExistingVpcSelected
          - Ref: SubnetsToLambda
          - Fn::Split:
            - ','
            - Fn::GetAtt:
              - VpcStack
              - Outputs.PrivateSubnetIds
        SecurityGroupIds:
        - Fn::GetAtt:
          - VpcStack
          - Outputs.CoreAppSecurityGroup
  AuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Ref: CoreApi
      ParentId:
        Fn::GetAtt:
        - CoreApi
        - RootResourceId
      PathPart: auth
  TokenResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId:
        Fn::GetAtt:
        - CoreApi
        - RootResourceId
      PathPart: token
      RestApiId:
        Ref: CoreApi
  OptionsTokenApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: CoreApi
      ResourceId:
        Ref: TokenResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: "'*'"
            method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
            method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-Target,ApiKey,apikey,Prefer,X-Shared-Token'"
          ResponseTemplates:
            application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
      - StatusCode: 200
        ResponseParameters:
          method.response.header.Access-Control-Allow-Origin: true
          method.response.header.Access-Control-Allow-Methods: true
          method.response.header.Access-Control-Allow-Headers: true
  PostTokenApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: POST
      ResourceId:
        Ref: TokenResource
      RestApiId:
        Ref: CoreApi
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials:
          Fn::GetAtt:
          - ApiGatewayLambdaExecutionRole
          - Arn
        Uri:
          Fn::Sub: 
            arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DBProxyLambda.Arn}/invocations
  ForgotPasswordResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Ref: CoreApi
      ParentId:
        Ref: AuthResource
      PathPart: forgot-password
  ForgotPasswordOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: CoreApi
      ResourceId:
        Ref: ForgotPasswordResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: "'*'"
            method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
            method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-Target,ApiKey,apikey,Prefer,X-Shared-Token'"
          ResponseTemplates:
            application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
      - StatusCode: 200
        ResponseParameters:
          method.response.header.Access-Control-Allow-Origin: true
          method.response.header.Access-Control-Allow-Methods: true
          method.response.header.Access-Control-Allow-Headers: true
  ForgotPasswordLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: f2-core-forgot-password-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
      - Ref: JwtAuthorizerSecretGetPolicy
      Policies:
      - PolicyName:
          Fn::Sub: f2-ses-sending-email-policy-${Environment}
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource:
              Fn::Sub: 
                arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*
  ForgotPasswordLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime:
        Fn::FindInMap:
        - StaticValues
        - F2core
        - LambdaRuntime
      Handler: index.handler
      Role:
        Fn::GetAtt:
