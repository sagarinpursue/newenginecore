      MemorySize: 128
      Timeout: 30
      Role: !GetAtt SharedTokenAuthorizerLambdaRole.Arn
      VpcConfig:
        SubnetIds: !If 
          - ExistingVpcSelected
          - !Ref SubnetsToLambda
          - !Split [',', !GetAtt VpcStack.Outputs.PrivateSubnetIds]
        SecurityGroupIds:
