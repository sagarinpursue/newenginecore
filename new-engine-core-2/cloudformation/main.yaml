AWSTemplateFormatVersion: 2010-09-09
Description: The Main CloudFormation Template for F2 platform $VERSION

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
      - stage
    Description:
      The environment suffix to create f2 resources with. This is
      only used to name resources and has no effect on behavior.

  PostgresVersion:
    Type: String
    Description: The version of the Postgres database
    Default: "17.5"
  MaxRdsCapacity:
    Type: Number
    Description: The maximum number capacity of RDS Cluster
    Default: 2
    MinValue: 1

  ExistingVpc:
    # Type: AWS::EC2::VPC::Id
    Type: String
    Description:
      ID of the existing VPC to deploy f2 infrastructure into.
      (leave empty to create a new one)
    Default: ""
  SubnetsToRDS:
    Type: CommaDelimitedList
    # Type: List<AWS::EC2::Subnet::Id>
    Description: List ID of the exiting subnets to RDS
    Default: ""
  SubnetsToEC2:
    Type: CommaDelimitedList
    # Type: List<AWS::EC2::Subnet::Id>
    Description: List ID of the exiting subnets to EC2
    Default: ""
  SubnetsToLambda:
    Type: CommaDelimitedList
    # Type: List<AWS::EC2::Subnet::Id>
    Description: List ID of the exiting subnets to Lambda
    Default: ""

  ApiServiceInstanceType:
    Type: String
    Description: "Select EC2 instance type for API server"
    Default: t3a.small
  KmsKeyId:
    Type: String
    Description: "ARN or ID existing KMS key for encryption ebs in ec2.(Optional)"
    Default: ""

  DeployWebUi:
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
    Description: Whether to deploy the Web UI nested stack (set to "true" to include it).
  # DeployWaf:
  #   Type: String
  #   Default: false
  #   AllowedValues:
  #     - true
  #     - false
  #   Description: Whether to deploy the WAF nested stack (set to "true" to include it).
  DeployCxStack:
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
    Description: Whether to deploy the CX nested stack (set to "true" to include it).
  DeployCmsStack:
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
    Description: Whether to deploy the CMS module (set to "true" to include it).
  
  DefaultAdminEmail:
    Type: String
    Description: "Default admin email address for the F2 platform"
  DefaultAdminPassword:
    Type: String
    Description: "Default admin password for the F2 platform"
    MinLength: 12
    NoEcho: true
    AllowedPattern: "^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$"

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: 
          default: "General Configuration"
        Parameters:
          - Environment
          - DefaultAdminEmail
          - DefaultAdminPassword
      - Label: 
          default: "RDS Configuration"
        Parameters:
          - PostgresVersion
          - MaxRdsCapacity
      - Label: 
          default: "Existing VPC Configuration"
        Parameters:
          - ExistingVpc
          - SubnetsToRDS
          - SubnetsToEC2
          - SubnetsToLambda
      - Label: 
          default: "EC2 Configuration"
        Parameters:
          - ApiServiceInstanceType
          - KmsKeyId
      - Label: 
          default: "Deploy Additional Modules"
        Parameters:
          - DeployWebUi
          # - DeployWaf
          - DeployCxStack
          - DeployCmsStack

Conditions:
  ShouldDeployWebUiStack: !Equals [!Ref DeployWebUi, 'true']
  # ShouldDeployWafStack: !Equals [!Ref DeployWaf, 'true']
  ShouldDeployCxStack: !Equals [!Ref DeployCxStack, 'true']
  ShouldDeployCmsStack: !Equals [!Ref DeployCmsStack, 'true']

  ExistingVpcSelected: !Not [!Equals [!Ref ExistingVpc, ""]]

Mappings:
  StaticValues:
    F2core:
      LambdaRuntime: nodejs22.x
      StageName: f2-api
      Version: $VERSION
      CoreBucketCmsTempFolder: cms-temporary-documents
      PortalFolder: web-ui
  RegionMap:
    us-east-1:
      ArtifactBucket: f2-platform-artifacts-us-east-1-dev
    eu-west-1:
      ArtifactBucket: f2-platform-artifacts-eu-west-1-dev
    us-west-2:
      ArtifactBucket: f2-platform-artifacts-us-west-2-dev
  EnvironmentMap:
    prod:
      JwtSecretName: f2-prod/auth/jwt
    stage:
      JwtSecretName: f2-stage/auth/jwt
    dev:
      JwtSecretName: f2-dev/auth/jwt

Resources:
#  Nested Stacks -------------->
  VpcStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 'templates/core/vpc.yaml'
      Parameters:
        Version: !FindInMap ['StaticValues', 'F2core', 'Version']
        Environment: !Ref Environment
        CustomerVpc: !Ref ExistingVpc

  RdsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 'templates/core/rds.yaml'
      Parameters:
        Environment: !Ref Environment
        PostgresVersion: !Ref PostgresVersion
        MaxCapacity: !Ref MaxRdsCapacity
        Version: !FindInMap ['StaticValues', 'F2core', 'Version']

        VPC: !GetAtt VpcStack.Outputs.VPC
        RdsSubnetIds: !If 
          - ExistingVpcSelected
          - !Join [",", !Ref SubnetsToRDS]
          - !GetAtt VpcStack.Outputs.PrivateSubnetIds
        LambdaSubnetIds: !If 
          - ExistingVpcSelected
          - !Join [",", !Ref SubnetsToLambda]
          - !GetAtt VpcStack.Outputs.PrivateSubnetIds
        RdsSecurityGroup: !GetAtt VpcStack.Outputs.RdsSecurityGroup
        APIServiceSecurityGroup: !GetAtt VpcStack.Outputs.APIServiceSecurityGroup

        CommonLayer: !Ref CommonLayer
        LambdaRuntime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']

  Ec2Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 'templates/core/ec2.yaml'
      Parameters:
        Environment: !Ref Environment
        PrivateBucketName: !Ref CoreBucket
        Version: !FindInMap ['StaticValues', 'F2core', 'Version']

        VPC: !GetAtt VpcStack.Outputs.VPC
        PrivateSubnetIds: !If 
          - ExistingVpcSelected
          - !Join [",", !Ref SubnetsToEC2]
          - !GetAtt VpcStack.Outputs.PrivateSubnetIds

        APIServiceSecurityGroup: !GetAtt VpcStack.Outputs.APIServiceSecurityGroup
        AlbSecurityGroup: !GetAtt VpcStack.Outputs.AlbSecurityGroup
        JwtAuthorizerSecret: !FindInMap ['EnvironmentMap', !Ref Environment, 'JwtSecretName']
        MasterCredentialsSecret: !GetAtt RdsStack.Outputs.MasterCredentialsSecret

        RdsClusterEndpoint: !GetAtt RdsStack.Outputs.RdsClusterEndpoint
        RdsClusterPort: !GetAtt RdsStack.Outputs.RdsClusterPort

        CommonLayer: !Ref CommonLayer
        LambdaRuntime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']

        InstanceType: !Ref ApiServiceInstanceType
        KmsKeyId: !Ref KmsKeyId

  WebUIStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployWebUiStack
    Properties:
      TemplateURL: 'templates/core/web-ui.yaml'
      Parameters:
        Environment: !Ref Environment
        Version: !FindInMap ['StaticValues', 'F2core', 'Version']
        PrivateBucketName: !Ref CoreBucket
        PortalFolder: !FindInMap ['StaticValues', 'F2core', 'PortalFolder']

  # WafStack:
  #   Type: AWS::CloudFormation::Stack
  #   Condition: ShouldDeployWafStack
  #   Properties:
  #     TemplateURL: 'templates/core/waf.yaml'
  #     Parameters:
  #       WafName: f2-core-waf

  CxStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployCxStack
    DependsOn:
      - AiStack
    Properties:
      TemplateURL: !Sub 
        - 'https://s3.${AWS::Region}.amazonaws.com/${ArtifactBucket}/f2-platform/${Version}/cx/template.yaml'
        - Version: !FindInMap ['StaticValues', 'F2core', 'Version']
          ArtifactBucket: !FindInMap ['RegionMap', !Ref 'AWS::Region', 'ArtifactBucket']
      Parameters:
        Environment: !Ref Environment
        VPC: !GetAtt VpcStack.Outputs.VPC
        PrivateSubnetIds:  !If 
          - ExistingVpcSelected
          - !Join [",", !Ref SubnetsToLambda]
          - !GetAtt VpcStack.Outputs.PrivateSubnetIds
        SecurityGroup: !GetAtt VpcStack.Outputs.CoreAppSecurityGroup
        PrivateBucketName: !Ref CoreBucket
        Version: !FindInMap ['StaticValues', 'F2core', 'Version']

        CoreApi: !Ref CoreApi
        CoreApiRootResourceId: !GetAtt CoreApi.RootResourceId
        ApiGatewayStage: !Ref ApiGatewayStage
        WebhookResourceId: !Ref WebhookResource
        JwtTokenAuthorizer: !Ref JwtTokenAuthorizer
        DBProxyLambdaArn: !GetAtt DBProxyLambda.Arn
        AwsInvokerLambdaArn: !GetAtt AwsInvokerLambda.Arn

        DatabaseApiUrl: !GetAtt Ec2Stack.Outputs.LoadBalancerLink
        JwtAuthorizerSecret: !FindInMap ['EnvironmentMap', !Ref Environment, 'JwtSecretName']
        JwtAuthorizerSecretGetPolicy: !Ref JwtAuthorizerSecretGetPolicy

        CommonLayer: !Ref CommonLayer
        LambdaRuntime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']

        MigrationDbScriptLambda: !GetAtt RdsStack.Outputs.MigrationDbScriptLambda
        ApiGatewayLambdaExecutionRole: !GetAtt ApiGatewayLambdaExecutionRole.Arn

  AiStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 'templates/modules/ai.yaml'
      Parameters:
        Environment: !Ref Environment
        CoreVPC: !GetAtt VpcStack.Outputs.VPC
        PrivateSubnetIds: !If 
          - ExistingVpcSelected
          - !Join [",", !Ref SubnetsToLambda]
          - !GetAtt VpcStack.Outputs.PrivateSubnetIds
        SecurityGroup: !GetAtt VpcStack.Outputs.CoreAppSecurityGroup
        Version: !FindInMap ['StaticValues', 'F2core', 'Version']

        LoadBalancerLink: !GetAtt Ec2Stack.Outputs.LoadBalancerLink
        JwtAuthorizerSecret: !FindInMap ['EnvironmentMap', !Ref Environment, 'JwtSecretName']
        JwtAuthorizerSecretGetPolicy: !Ref JwtAuthorizerSecretGetPolicy

        CommonLayer: !Ref CommonLayer
        LambdaRuntime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']

        CoreApi: !Ref CoreApi
        CoreApiRootResourceId: !GetAtt CoreApi.RootResourceId
        ApiGatewayStage: !Ref ApiGatewayStage

        PrivateBucketName: !Ref CoreBucket
        JwtTokenAuthorizer: !Ref JwtTokenAuthorizer
        SharedTokenAuthorizer: !Ref SharedTokenAuthorizer
        DBProxyLambdaArn: !GetAtt DBProxyLambda.Arn
        AwsInvokerLambdaArn: !GetAtt AwsInvokerLambda.Arn

        MigrationDbScriptLambda: !GetAtt RdsStack.Outputs.MigrationDbScriptLambda
        ApiGatewayLambdaExecutionRole: !GetAtt ApiGatewayLambdaExecutionRole.Arn

  CmsStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployCmsStack
    Properties:
      TemplateURL: 'templates/modules/cms.yaml'
      Parameters:
        Environment: !Ref Environment
        CoreVPC: !GetAtt VpcStack.Outputs.VPC
        PrivateSubnetIds: !If 
          - ExistingVpcSelected
          - !Join [",", !Ref SubnetsToLambda]
          - !GetAtt VpcStack.Outputs.PrivateSubnetIds
        SecurityGroup: !GetAtt VpcStack.Outputs.CoreAppSecurityGroup
        Version: !FindInMap ['StaticValues', 'F2core', 'Version']

        DatabaseApiUrl: !GetAtt Ec2Stack.Outputs.LoadBalancerLink
        JwtAuthorizerSecret: !FindInMap ['EnvironmentMap', !Ref Environment, 'JwtSecretName']
        JwtAuthorizerSecretGetPolicy: !Ref JwtAuthorizerSecretGetPolicy

        CommonLayer: !Ref CommonLayer
        LambdaRuntime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']

        CoreApi: !Ref CoreApi
        CoreApiRootResourceId: !GetAtt CoreApi.RootResourceId
        CoreBucket: !Ref CoreBucket
        CoreBucketCmsTempFolder: !FindInMap ['StaticValues', 'F2core', 'CoreBucketCmsTempFolder']
        JwtTokenAuthorizer: !Ref JwtTokenAuthorizer
        ApiGatewayLambdaExecutionRole: !GetAtt ApiGatewayLambdaExecutionRole.Arn
        MigrationDbScriptLambda: !GetAtt RdsStack.Outputs.MigrationDbScriptLambda
        EmptyS3BucketLambda: !GetAtt EmptyS3BucketLambda.Arn
        EmptyS3BucketLambdaRole: !GetAtt EmptyS3BucketLambdaRole.Arn

#  JWT Secrets -------------->

  JwtAuthorizerSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !FindInMap ['EnvironmentMap', !Ref Environment, 'JwtSecretName']
      GenerateSecretString:
        GenerateStringKey: jwtSecret
        ExcludeCharacters: "%+~`#$&*()|[]{}:;<>?!'/@\"\\"
        PasswordLength: 40
        SecretStringTemplate: '{"anonKey":"","serviceRoleKey":""}'

  GenerateJwtKeyLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-clf-generate-jwt-keys-script-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaSecretsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - secretsmanager:GetSecretValue
                  - secretsmanager:UpdateSecret
                Resource: !Ref JwtAuthorizerSecret
  
  GenerateJwtKeyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-clf-generate-jwt-keys-script-${Environment}'
      Handler: index.handler
      Role: !GetAtt GenerateJwtKeyLambdaExecutionRole.Arn
      Runtime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']
      Layers:
        - !Ref CommonLayer
      Timeout: 60
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          JWT_AUTHORIZER_SECRET: !FindInMap ['EnvironmentMap', !Ref Environment, 'JwtSecretName']
      Code: ./lambda-dist/_cloudformation-scripts/generate-jwt-keys # ! <--- Locale path to 'aws cloudformation package'

  GenerateJwtKeyTrigger:
    Type: Custom::GenerateJwtKey
    Properties:
      ServiceTimeout: 70
      ServiceToken: !GetAtt GenerateJwtKeyLambda.Arn
      JwtAuthorizerSecretArn: !Ref JwtAuthorizerSecret

  JwtAuthorizerSecretGetPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'f2-core-jwt-authorizer-secret-get-policy-${Environment}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref JwtAuthorizerSecret

# S3 Buckets -------------->
  CoreBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 
        - 'f2-platform-${UniqueId}-${Environment}'
        - UniqueId: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      AccessControl: Private
      LifecycleConfiguration: !If 
        - ShouldDeployCmsStack
        - Rules:
            - Id: ClearTemporaryDocumentsToFolderCms
              Status: Enabled
              Prefix: !Sub
                - "${CmsTempFolder}/"
                - CmsTempFolder: !FindInMap [StaticValues, F2core, CoreBucketCmsTempFolder]
              ExpirationInDays: 1
        - !Ref "AWS::NoValue"
      CorsConfiguration: !If
          - ShouldDeployCmsStack
          - CorsRules:
              - AllowedHeaders:
                  - '*'
                AllowedMethods:
                  - PUT
                AllowedOrigins:
                  - "http://localhost:4200" # TODO: we need this or it security hole?
                  - "https://*.cloudfront.net"
                  # TODO: Need to add specific URL of Portal
                  # - !Sub
                  #   - https://${DomainName}
                  #   - DomainName: !GetAtt WebUIStack.Outputs.CloudFrontPortalDomain
          - !Ref AWS::NoValue

# DB Proxy Lambda -------------->
  DBProxyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-core-db-api-proxy-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy

  DBProxyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-core-db-api-proxy-${Environment}'
      Runtime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']
      Handler: index.handler
      Code: ./lambda-dist/db-api-invoker # ! <--- Locale path to 'aws cloudformation package'
      Layers:
        - !Ref CommonLayer
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_API_URL: !GetAtt Ec2Stack.Outputs.LoadBalancerLink
          JWT_AUTHORIZER_SECRET: !FindInMap ['EnvironmentMap', !Ref Environment, 'JwtSecretName']
      Role: !GetAtt DBProxyLambdaRole.Arn
      VpcConfig:
        SubnetIds: !If 
          - ExistingVpcSelected
          - !Ref SubnetsToLambda
          - !Split [',', !GetAtt VpcStack.Outputs.PrivateSubnetIds]
        SecurityGroupIds:
          - !GetAtt VpcStack.Outputs.CoreAppSecurityGroup

  # --- API: /auth
  AuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !GetAtt CoreApi.RootResourceId
      PathPart: 'auth'

  # --- API: POST /token ---
  TokenResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt CoreApi.RootResourceId
      PathPart: 'token'
      RestApiId: !Ref CoreApi

  OptionsTokenApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref TokenResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-Target,ApiKey,apikey,Prefer,X-Shared-Token'"
            ResponseTemplates:
              application/json: ""
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  PostTokenApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: POST
      ResourceId: !Ref TokenResource
      RestApiId: !Ref CoreApi
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials: !GetAtt ApiGatewayLambdaExecutionRole.Arn
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DBProxyLambda.Arn}/invocations"

  # TODO: Do add invoke permissions for all lambda functions or use Role for AWS API Gateway?
  # PostTokenApiPermission:
  #   Type: AWS::Lambda::Permission
  #   Properties:
  #     FunctionName: !GetAtt DBProxyLambda.Arn
  #     Action: lambda:InvokeFunction
  #     Principal: apigateway.amazonaws.com
  #     SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CoreApi}/*/POST/token"

  # --- API: POST /auth/forgot-password ---
  ForgotPasswordResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref AuthResource
      PathPart: 'forgot-password'

  ForgotPasswordOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref ForgotPasswordResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-Target,ApiKey,apikey,Prefer,X-Shared-Token'"
            ResponseTemplates:
              application/json: ""
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  ForgotPasswordLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-core-forgot-password-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy
      Policies:
        - PolicyName: !Sub 'f2-ses-sending-email-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*'

  ForgotPasswordLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']
      Handler: index.handler
      Role: !GetAtt ForgotPasswordLambdaRole.Arn
      FunctionName: !Sub 'f2-core-forgot-password-${Environment}'
      Code: ./lambda-dist/core-forgot-password
      MemorySize: 512
      Timeout: 30
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !If
          - ExistingVpcSelected
          - !Ref SubnetsToLambda
          - !Split [ ',', !GetAtt VpcStack.Outputs.PrivateSubnetIds ]
        SecurityGroupIds:
          - !GetAtt VpcStack.Outputs.CoreAppSecurityGroup
      Environment:
        Variables:
          DB_API_URL: !GetAtt Ec2Stack.Outputs.LoadBalancerLink
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret
          PORTAL_DOMAIN: !If [ShouldDeployWebUiStack, !GetAtt WebUIStack.Outputs.CloudFrontPortalDomain, "none"]

  ForgotPasswordLambdaPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref ForgotPasswordResource
      HttpMethod: POST
      AuthorizationType: 'NONE'
      Integration:
        Type: AWS_PROXY
        Credentials: !GetAtt ApiGatewayLambdaExecutionRole.Arn
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ForgotPasswordLambda.Arn}/invocations'

  # --- API: POST /auth/reset-password ---
  ResetPasswordResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref AuthResource
      PathPart: 'reset-password'

  ResetPasswordOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref ResetPasswordResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-Target,ApiKey,apikey,Prefer,X-Shared-Token'"
            ResponseTemplates:
              application/json: ""
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  ResetPasswordLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-core-reset-password-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy

  ResetPasswordLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !FindInMap [ 'StaticValues', 'F2core', 'LambdaRuntime' ]
      Handler: index.handler
      Role: !GetAtt ResetPasswordLambdaRole.Arn
      FunctionName: !Sub 'f2-core-reset-password-${Environment}'
      Code: ./lambda-dist/core-reset-password
      MemorySize: 512
      Timeout: 30
      Layers:
