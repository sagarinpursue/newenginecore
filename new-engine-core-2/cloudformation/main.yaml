      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy

# --- Search Post Lambda --->
  SearchPostLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-search-post-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy
      Policies:
        - PolicyName: !Sub 'f2-search-post-bedrock-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:ListAgentActionGroups
                  - bedrock:GetAgentActionGroup
                  - bedrock:ListAgentCollaborators
                  - bedrock:ListAgentKnowledgeBases
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*'

  SearchPostLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-core-search-post-${Environment}'
      Runtime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']
      Handler: index.handler
      Code: ./lambda-dist/search-post # ! <--- Locale path to 'aws cloudformation package'
      Layers:
        - !Ref CommonLayer
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_API_URL: !GetAtt Ec2Stack.Outputs.LoadBalancerLink
          JWT_AUTHORIZER_SECRET: !FindInMap ['EnvironmentMap', !Ref Environment, 'JwtSecretName']
      Role: !GetAtt SearchPostLambdaRole.Arn
      VpcConfig:
        SubnetIds: !If 
          - ExistingVpcSelected
          - !Ref SubnetsToLambda
          - !Split [',', !GetAtt VpcStack.Outputs.PrivateSubnetIds]
        SecurityGroupIds:
          - !GetAtt VpcStack.Outputs.CoreAppSecurityGroup

# --- API: POST /search ---
  SearchResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !GetAtt CoreApi.RootResourceId
      PathPart: 'search'

  SearchOptionsApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref SearchResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-Target,ApiKey,apikey,Prefer,X-Shared-Token'"
            ResponseTemplates:
              application/json: ""
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  SearchPostApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: POST
      ResourceId: !Ref SearchResource
      RestApiId: !Ref CoreApi
      AuthorizationType: 'CUSTOM'
      AuthorizerId: !Ref JwtTokenAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials: !GetAtt ApiGatewayLambdaExecutionRole.Arn
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SearchPostLambda.Arn}/invocations"

  WebhookResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !GetAtt CoreApi.RootResourceId
      PathPart: 'webhook'

# JWT Authorizer Lambda -------------->

  JwtTokenAuthorizerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-core-jwt-token-authorizer-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref JwtAuthorizerSecretGetPolicy

  JwtTokenAuthorizerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-core-jwt-token-authorizer-${Environment}'
      Runtime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']
      Handler: index.handler
      Code: ./lambda-dist/jwt-token-authorizer/
      Environment:
        Variables:
          JWT_AUTHORIZER_SECRET: !FindInMap ['EnvironmentMap', !Ref Environment, 'JwtSecretName']
      Layers:
        - !Ref CommonLayer
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt JwtTokenAuthorizerLambdaRole.Arn

  JwtTokenAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: JwtTokenAuthorizer
      Type: TOKEN
      AuthorizerCredentials: !GetAtt ApiGatewayLambdaExecutionRole.Arn
      AuthorizerUri: !Sub
        - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
        - LambdaArn: !GetAtt JwtTokenAuthorizerLambda.Arn
      IdentitySource: method.request.header.Authorization
      RestApiId: !Ref CoreApi
      AuthorizerResultTtlInSeconds: 0

  # TODO: Do add invoke permissions for all lambda functions or use Role for AWS API Gateway?
