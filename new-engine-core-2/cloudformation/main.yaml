  SharedTokenAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: SharedTokenAuthorizer
      Type: TOKEN
      AuthorizerCredentials: !GetAtt ApiGatewayLambdaExecutionRole.Arn
      AuthorizerUri: !Sub
        - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
        - LambdaArn: !GetAtt SharedTokenAuthorizerLambda.Arn
      IdentitySource: method.request.header.X-Shared-Token
      RestApiId: !Ref CoreApi
      AuthorizerResultTtlInSeconds: 0

  # TODO: Do add invoke permissions for all lambda functions or use Role for AWS API Gateway?
  # SharedLambdaInvokePermission:
  #   Type: AWS::Lambda::Permission
  #   Properties:
  #     Action: lambda:InvokeFunction
  #     FunctionName: !GetAtt SharedTokenAuthorizerLambda.Arn
  #     Principal: apigateway.amazonaws.com
  #     SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CoreApi}/*/*"

# ----------- AwsInvokerLambda -----------
  AwsInvokerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-core-aws-invoker-${Environment}'
      Runtime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']
      Handler: index.handler
      Code: ./lambda-dist/aws-invoker
      Timeout: 30
      MemorySize: 512
      Layers:
        - !Ref CommonLayer
      Role: !GetAtt AwsInvokerLambdaRole.Arn

  AwsInvokerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-core-aws-invoker-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - 'arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess'
      Policies:
        - PolicyName: !Sub 'f2-aws-invoker-bedrock-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:StartIngestionJob
                  - bedrock:GetIngestionJob
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*'
              - Effect: Allow
                Action:
                  - bedrock:ListFoundationModels
                  - bedrock:ListAgentActionGroups
                  - bedrock:GetAgentActionGroup
                  - bedrock:ListAgentCollaborators
                  - bedrock:GetAgent
                  - bedrock:ListAgentKnowledgeBases
                  - bedrock:AssociateAgentKnowledgeBase
                  - bedrock:UpdateAgentKnowledgeBase
                  - bedrock:DisassociateAgentKnowledgeBase
                  - bedrock:CreateAgentActionGroup
                  - bedrock:UpdateAgentActionGroup
                  - bedrock:DeleteAgentActionGroup
                  - bedrock:AssociateAgentCollaborator
                  - bedrock:UpdateAgentCollaborator
                  - bedrock:DisassociateAgentCollaborator
                Resource: '*'

  CommonLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub 'f2-core-common-layer-${Environment}'
      Description: Common layer
      Content: ./lambda-dist/_common-layer
      CompatibleRuntimes:
        - !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']

# Core API -------------->
  CoreApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'f2-api-${Environment}'
      Description: 'Core API for f2 application'
      EndpointConfiguration:
        Types:
          - REGIONAL

  ApiGatewayLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-core-lambda-execution-api-gateway-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - apigateway.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: InvokeCoreLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: 
                  - !GetAtt JwtTokenAuthorizerLambda.Arn
                  - !GetAtt SharedTokenAuthorizerLambda.Arn
                  - !GetAtt AwsInvokerLambda.Arn
                  - !GetAtt DBProxyLambda.Arn
                  - !GetAtt ForgotPasswordLambda.Arn
                  - !GetAtt ResetPasswordLambda.Arn
                  - !GetAtt SearchPostLambda.Arn
                  - !GetAtt UserDeleteLambda.Arn
                  - !GetAtt UserPostLambda.Arn

  ApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: !FindInMap ['StaticValues', 'F2core', 'StageName']
      Description: 'Stage for Core API'
      RestApiId: !Ref CoreApi
      DeploymentId: !Ref CoreApiDeployment

  CoreApiDeployment:
    Type: AWS::ApiGateway::Deployment
  # TODO: Do add invoke permissions for all lambda functions or use Role for AWS API Gateway?
    DependsOn:
      - PutUserApiMethod
      - GetUserApiMethod
      - GetAccountListApiMethod
      - PostTokenApiMethod
    Properties:
      RestApiId: !Ref CoreApi
      Description: !Sub
        - |
          Deployed api nested stacks:
          Version = ${Version}
          CX     = ${CxId}
        - CxId: !If [ ShouldDeployCxStack, "CxStack", "OFF" ]
          Version: !FindInMap ['StaticValues', 'F2core', 'Version']

  # =================================================================
  # 1. UtilApiRedeployment Lambda
  # =================================================================
  UtilApiRedeploymentLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-clf-util-api-redeployment-${Environment}'
      Runtime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']
      Handler: index.handler
      Code: ./lambda-dist/_cloudformation-scripts/util-api-redeployment
      Layers:
        - !Ref CommonLayer
      Timeout: 60
      MemorySize: 512
      Role: !GetAtt UtilApiRedeploymentLambdaRole.Arn

  UtilApiRedeploymentLambdaVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref UtilApiRedeploymentLambda

  UtilApiRedeploymentLambdaEventConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref UtilApiRedeploymentLambda
      MaximumRetryAttempts: 0
      Qualifier: !GetAtt UtilApiRedeploymentLambdaVersion.Version

  UtilApiRedeploymentLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-util-api-redeployment-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub 'f2-Lambda-ApiGateway-Deployment-Policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - apigateway:CreateDeployment
                  - apigateway:POST
                Resource: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${CoreApi}/deployments"
              - Effect: Allow
                Action:
                  - apigateway:UpdateStage
                  - apigateway:PATCH
                Resource: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${CoreApi}/stages/${ApiGatewayStage}"
              - Effect: Allow
                Action:
                  - apigateway:GET
                Resource: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${CoreApi}/stages/${ApiGatewayStage}/exports/oas30"
              - Effect: Allow
                Action:
                  - apigateway:GetExport
                Resource: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${CoreApi}/stages/${ApiGatewayStage}"
        - PolicyName: !Sub 'f2-Lambda-S3-Cloudfront-Deployment-Policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${CoreBucket}/*"
              - !If
                - ShouldDeployWebUiStack
                - Effect: Allow
                  Action:
                    - cloudfront:CreateInvalidation
                  Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
                - !Ref AWS::NoValue

  # TODO: need to find a right solution to redeploy api stage,
  # right now api resources aren't being removed by custom lambda for some reason
  # https://stackoverflow.com/questions/41423439/cloudformation-doesnt-deploy-to-api-gateway-stages-on-update
  InvokeUtilApiRedeploymentLambda:
    Type: Custom::ApiRedeployment
    DependsOn:
      - DBProxyLambda
      - AwsInvokerLambda
      - JwtTokenAuthorizerLambda
      - SharedTokenAuthorizerLambda
      - UtilApiRedeploymentLambda
      - GetAccountListApiMethod
      - GetUserApiMethod
      - PostTokenApiMethod
      - PutUserApiMethod
      - PostUserApiMethod
      - PatchUserApiMethod
    Properties:
      ServiceToken: !GetAtt UtilApiRedeploymentLambda.Arn
      RestApiId: !Ref CoreApi
      StageName: !Ref ApiGatewayStage
      Version: !FindInMap ['StaticValues', 'F2core', 'Version']
      S3BucketName: !Ref CoreBucket
      S3ObjectKey: 'swagger/swagger.json'
      # TODO: It is necessary to choose the best solution for Swagger
      # CloudFrontDistributionId: !If [ ShouldDeployWebUiStack, !GetAtt WebUIStack.Outputs.CloudFrontSwaggerDistributionId, "OFF" ]
      CloudFrontDistributionId: "OFF"
      Description:
        - |
          Deployed modules:
          CX_MODULE_NAME = ${CxModuleName}
          CX_METHODS = ${CxMethods}

          AI_MODULE_NAME = ${AiModuleName}
          AI_METHODS = ${AiMethods}

          CMS_MODULE_NAME = ${CmsModuleName}
        - CxMethods: !If [ ShouldDeployCxStack, !GetAtt CxStack.Outputs.ApiMethods, "OFF" ]
          AiMethods: !GetAtt AiStack.Outputs.ApiMethods
          CxModuleName: !If [ ShouldDeployCxStack, !GetAtt CxStack.Outputs.ModuleName, "OFF" ]
          AiModuleName: !GetAtt AiStack.Outputs.ModuleName
          CmsModuleName: !If [ ShouldDeployCmsStack, !GetAtt CmsStack.Outputs.ModuleName, "OFF" ]

  # =================================================================
  # ModifyRdsDeleteProtection Lambda
  # =================================================================
  ModifyRdsDeleteProtectionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-clf-modify-rds-delete-protection-${Environment}'
      Runtime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']
      Handler: index.handler
      Code: ./lambda-dist/_cloudformation-scripts/modify-rds-delete-protection
      Layers:
        - !Ref CommonLayer
      Timeout: 60
      MemorySize: 512
      Role: !GetAtt ModifyRdsDeleteProtectionLambdaRole.Arn
  ModifyRdsDeleteProtectionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-clf-modify-rds-delete-protection-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ModifyRDSClusterDeletionProtection
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - rds:ModifyDBCluster
                Resource: !GetAtt RdsStack.Outputs.RdsClusterArn
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # =================================================================
  # ModifyRdsDeleteProtection
  # =================================================================
  ModifyRdsDeleteProtection:
    Type: Custom::ModifyRdsDeleteProtection
    DependsOn:
      - InvokeUtilApiRedeploymentLambda
    Properties:
      ServiceToken: !GetAtt ModifyRdsDeleteProtectionLambda.Arn
      ClusterIdentifier: !GetAtt RdsStack.Outputs.RdsClusterId

  # =================================================================
  # EmptyS3BucketLambda Lambda
  # =================================================================
  EmptyS3BucketLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-clf-empty-s3-bucket-${Environment}'
      Runtime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']
      Handler: index.handler
      Code: ./lambda-dist/_cloudformation-scripts/empty-s3-bucket
      Layers:
        - !Ref CommonLayer
      Timeout: 60
      MemorySize: 512
      Role: !GetAtt EmptyS3BucketLambdaRole.Arn
  EmptyS3BucketLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-clf-empty-s3-bucket-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub 'f2-empty-core-s3-bucket-role-policy-${Environment}'
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketVersioning
                  - s3:DeleteObjectVersion
                  - s3:ListBucketVersions
                Resource: 
                  - !GetAtt CoreBucket.Arn
                  - !Sub "${CoreBucket.Arn}/*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  
  # =================================================================
  # EmptyCoreS3Bucket
  # =================================================================
  EmptyCoreS3Bucket:
    Type: Custom::EmptyCoreS3Bucket
    Properties:
      ServiceToken: !GetAtt EmptyS3BucketLambda.Arn
      BucketName: !Ref CoreBucket

  # =================================================================
  # Create default admin user
  # =================================================================
  CreateDefaultAdminLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-clf-create-default-admin-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy
  
  CreateDefaultAdminLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-clf-create-default-admin-${Environment}'
      Handler: index.handler
      Role: !GetAtt CreateDefaultAdminLambdaRole.Arn
      Runtime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']
      Code: ./lambda-dist/_cloudformation-scripts/create-admin-user # ! <--- Locale path to 'aws cloudformation package'
      Layers:
        - !Ref CommonLayer
      Timeout: 60
      VpcConfig:
        SubnetIds: !If 
          - ExistingVpcSelected
          - !Ref SubnetsToLambda
          - !Split [',', !GetAtt VpcStack.Outputs.PrivateSubnetIds]
        SecurityGroupIds:
          - !GetAtt VpcStack.Outputs.CoreAppSecurityGroup
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          JWT_AUTHORIZER_SECRET: !FindInMap ['EnvironmentMap', !Ref Environment, 'JwtSecretName']
          DB_API_URL: !GetAtt Ec2Stack.Outputs.LoadBalancerLink

  CreateDefaultAdminTrigger:
    Type: Custom::CreateDefaultAdmin
    DependsOn: 
      - JwtAuthorizerSecret
    Properties:
      ServiceTimeout: 70
      ServiceToken: !GetAtt CreateDefaultAdminLambda.Arn
      AdminEmail: !Ref DefaultAdminEmail
      AdminPassword: !Ref DefaultAdminPassword

  # =================================================================
  # 20. Outputs
  # =================================================================
Outputs:
  PlatformVersion:
    Description: The version of the platform
    Value: !FindInMap ['StaticValues', 'F2core', 'Version']
  F2ApiUrl:
    Description: "API Gateway Invoke URL"
    Value: !Sub "https://${CoreApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiGatewayStage}"
  F2PortalBucketName:
    Condition: ShouldDeployWebUiStack
    Description: "F2 Portal bucket name for CloudFront"
    Value: !Sub 
      - "${CoreBucket}/${PortalFolder}"
      - PortalFolder: !FindInMap ['StaticValues', 'F2core', 'PortalFolder']
  F2PortalUrl:
    Condition: ShouldDeployWebUiStack
    Description: "Portal CloudFront URL"
    Value: !Sub
      - "https://${DomainName}"
      - DomainName: !GetAtt WebUIStack.Outputs.CloudFrontPortalDomain
  F2PortalDistributionId:
    Condition: ShouldDeployWebUiStack
    Description: "Portal CloudFront Distribution Id"
    Value: !GetAtt WebUIStack.Outputs.DistributionF2PortalId