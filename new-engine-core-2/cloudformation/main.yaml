  # --- UserDelete Lambda ---
  UserDeleteLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-core-user-delete-${Environment}'
      Runtime: !FindInMap [ 'StaticValues', 'F2core', 'LambdaRuntime' ]
      Handler: index.handler
      Code: ./lambda-dist/user-delete # ! <--- Locale path to 'aws cloudformation package'
      Layers:
        - !Ref CommonLayer
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_API_URL: !GetAtt Ec2Stack.Outputs.LoadBalancerLink
          JWT_AUTHORIZER_SECRET: !FindInMap ['EnvironmentMap', !Ref Environment, 'JwtSecretName']
      Role: !GetAtt UserDeleteLambdaRole.Arn
      VpcConfig:
        SubnetIds: !If
          - ExistingVpcSelected
          - !Ref SubnetsToLambda
          - !Split [ ',', !GetAtt VpcStack.Outputs.PrivateSubnetIds ]
        SecurityGroupIds:
          - !GetAtt VpcStack.Outputs.CoreAppSecurityGroup

  UserDeleteLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-core-user-delete-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy

  # --- UserPost Lambda ---
  UserPostLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-core-user-post-${Environment}'
      Runtime: !FindInMap [ 'StaticValues', 'F2core', 'LambdaRuntime' ]
      Handler: index.handler
      Code: ./lambda-dist/user-post # ! <--- Locale path to 'aws cloudformation package'
      Layers:
        - !Ref CommonLayer
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ENV: !Ref Environment
          DB_API_URL: !GetAtt Ec2Stack.Outputs.LoadBalancerLink
          JWT_AUTHORIZER_SECRET: !FindInMap ['EnvironmentMap', !Ref Environment, 'JwtSecretName']
      Role: !GetAtt UserPostLambdaRole.Arn
      VpcConfig:
        SubnetIds: !If
          - ExistingVpcSelected
          - !Ref SubnetsToLambda
          - !Split [ ',', !GetAtt VpcStack.Outputs.PrivateSubnetIds ]
        SecurityGroupIds:
