    Properties:
      RoleName: !Sub 'f2-core-shared-token-authorizer-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy

  SharedTokenAuthorizerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-core-shared-token-authorizer-${Environment}'
      Runtime: !FindInMap ['StaticValues', 'F2core', 'LambdaRuntime']
      Handler: index.handler
      Code: ./lambda-dist/shared-token-authorizer
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
