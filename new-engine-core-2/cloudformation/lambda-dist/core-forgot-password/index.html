<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link href="https://fonts.googleapis.com/css?family=Nunito Sans" rel="stylesheet" />
    <title>Reset F2 Platform Password</title>
    <style>
        /* -------------------------------------
              GLOBAL RESETS
          ------------------------------------- */

        img {
            border: none;
            -ms-interpolation-mode: bicubic;
            max-width: 100%;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        body {
            background-color: white;
            font-family: sans-serif;
            -webkit-font-smoothing: antialiased;
            font-size: 14px;
            line-height: 1.4;
            margin: 0;
            padding: 0;
            -ms-text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
        }

        table {
            border-collapse: separate;
            width: 100%;
        }

        table td {
            font-family: sans-serif;
            font-size: 14px;
            vertical-align: top;
        }

        /* -------------------------------------
              BODY & CONTAINER
          ------------------------------------- */

        .body {
            background-color: white;
            width: 100%;
        }

        .container {
            display: block;
            margin: 0 auto !important;
            max-width: 800px;
            width: 656px;
            background-color: #f6f6f6;
        }

        .middle-container {
            font-family: "Milliard";
            font-style: normal;
            font-size: 14px;
            line-height: 20px;
            color: #21373d;
            margin: 10px 0;
            text-align: left;
        }

        .content {
            box-sizing: border-box;
            display: block;
            margin: 0 auto;
            max-width: 700px;
            padding: 32px;
        }

        /* -------------------------------------
              HEADER, FOOTER, MAIN
          ------------------------------------- */

        .main {
            background: white;
            width: 100%;
        }

        .wrapper {
            box-sizing: border-box;
            padding: 32px 105px;
        }

        .mp-email-card {
            width: 400px;
        }

        .approve-text {
            font-size: 12px;
            text-align: justify;
            color: #308099;
        }

        .approve-name {
            text-align: left;
        }

        .social-links span {
            margin-right: 15px;
        }

        /* -------------------------------------
              TYPOGRAPHY
          ------------------------------------- */

        h1,
        h2,
        h3,
        h4 {
            color: #000000;
            font-family: sans-serif;
            font-weight: 600;
            line-height: 1.4;
            margin: 20px 0;
        }

        h1 {
            font-size: 35px;
            font-weight: 300;
            text-align: center;
            text-transform: capitalize;
        }

        p,
        ul,
        ol {
            font-family: sans-serif;
            font-size: 14px;
            font-weight: normal;
            margin: 0 0 10px;
        }

        p li,
        ul li,
        ol li {
            list-style-position: inside;
            margin-left: 5px;
        }

        a {
            color: #1f92ea;
            text-decoration: underline;
        }

        small {
            color: #97bfcc;
            font-family: "Calibri";
            font-style: normal;
            font-weight: 700;
            font-size: 14px;
            line-height: 150%;
        }

        /* -------------------------------------
              BUTTONS
          ------------------------------------- */

        .resetPassBtn {
            background: #318097;
            border: 0.2px solid #006837;
            border-radius: 5px;
            color: #ffffff;
            padding: 9px;
            cursor: pointer;
        }

        .view-post {
            text-decoration: none;
            color: #fff !important;
        }

        .middle-sub-container {
            font-family: "Milliard";
            font-style: normal;
            font-weight: 500;
            font-size: 12px;
            /*line-height: 20px;*/
            color: #53575e;
            text-align: left;
            margin-bottom: 10px;
        }

        .middle-heading-description {
            font-weight: 400;
            font-size: 14px;
            line-height: 20px;
            letter-spacing: 0.46px;
            font-feature-settings: "pnum" on, "lnum" on;
            color: #707070;
            text-align: justify;
            margin-right: 22px;
            margin-top: 3px;
            text-align: left;
        }

        .post-btn a {
            color: white;
        }

        .btn {
            box-sizing: border-box;
            width: 100%;
            margin-bottom: 28px;
        }

        .btn table {
            width: auto;
        }

        .btn table td {
            background-color: #ffffff;
            border-radius: 5px;
            text-align: center;
        }

        .btn a {
            background-color: #ffffff;
            border: solid 1px #1f92ea;
            border-radius: 30px;
            box-sizing: border-box;
            color: #1f92ea;
            cursor: pointer;
            display: inline-block;
            font-size: 14px;
            font-weight: bold;
            margin: 0;
            padding: 12px 25px;
            text-decoration: none;
            text-transform: capitalize;
        }

        .btn-primary table td {
            background: #1f92ea;
            border-radius: 50px;
            color: #ffffff;
        }

        .btn-primary a {
            background: #1f92ea;
            border-radius: 50px;
            color: #ffffff;
        }

        /* -------------------------------------
              OTHER STYLES THAT MIGHT BE USEFUL
          ------------------------------------- */

        .powered-by a {
            text-decoration: none;
        }

        hr {
            border: 0;
            border-bottom: 1px solid #f6f6f6;
            margin: 20px 0;
        }

        /* -------------------------------------
              RESPONSIVE AND MOBILE FRIENDLY STYLES
          ------------------------------------- */

        @media only screen and (max-width: 620px) {
            table[class="body"] h1 {
                font-size: 28px !important;
                margin-bottom: 10px !important;
            }

            table[class="body"] p,
            table[class="body"] ul,
            table[class="body"] ol,
            table[class="body"] td,
            table[class="body"] span,
            table[class="body"] a {
                font-size: 16px !important;
            }

            table[class="body"] .wrapper,
            table[class="body"] .article {
                padding: 10px !important;
            }

            table[class="body"] .content {
                padding: 0 !important;
            }

            table[class="body"] .container {
                padding: 0 !important;
                width: 100% !important;
            }

            table[class="body"] .main {
                border-left-width: 0 !important;
                border-radius: 0 !important;
                border-right-width: 0 !important;
            }

            table[class="body"] .btn table {
                width: 100% !important;
            }

            table[class="body"] .btn a {
                width: 100% !important;
            }

            table[class="body"] .img-responsive {
                height: auto !important;
                max-width: 100% !important;
                width: auto !important;
            }
        }

        /* -------------------------------------
              PRESERVE THESE STYLES IN THE HEAD
          ------------------------------------- */

        @media all {
            .ExternalClass {
                width: 100%;
            }

            .ExternalClass,
            .ExternalClass p,
            .ExternalClass span,
            .ExternalClass font,
            .ExternalClass td,
            .ExternalClass div {
                line-height: 100%;
            }

            .apple-link a {
                color: inherit !important;
                font-family: inherit !important;
                font-size: inherit !important;
                font-weight: inherit !important;
                line-height: inherit !important;
                text-decoration: none !important;
            }

            .btn-primary table td:hover {
                background-color: #34495e !important;
            }

            .btn-primary a:hover {
                background-color: #34495e !important;
                border-color: #34495e !important;
            }
        }
    </style>
</head>
