AWSTemplateFormatVersion: 2010-09-09
Description: Customer Experience module

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W3002

Parameters:
  Environment:
    Type: String
  VPC:
    Type: String
  PrivateSubnetIds:
    Type: CommaDelimitedList
  SecurityGroup:
    Type: String
  CoreApi:
    Type: String
  ApiGatewayStage:
    Type: String
  PrivateBucketName:
    Type: String
  LlmDataSourcesFolder:
    Type: String
    Default: llm-data-sources
  CoreApiRootResourceId:
    Type: String
  WebhookResourceId:
    Type: String
  JwtTokenAuthorizer:
    Type: String
  DBProxyLambdaArn:
    Type: String
  AwsInvokerLambdaArn:
    Type: String
  DatabaseApiUrl:
    Type: String
  JwtAuthorizerSecret:
    Type: String
  JwtAuthorizerSecretGetPolicy:
    Type: String
  CommonLayer:
    Type: String
  LambdaRuntime:
    Type: String
    Default: nodejs22.x
  CxChannelsFolder:
    Type: String
    Default: cx-channels
  MigrationDbScriptLambda:
    Type: String
  ModuleName:
    Type: String
    Default: cx-module
  ApiGatewayLambdaExecutionRole:
    Type: String
  Version:
    Type: String
    Default: '1.0.0'

Resources:
  # =================================================================
  # Common CX Module Resources
  # =================================================================

  CxScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: 'F2-CX-Module'

  # =================================================================
  # 1. Api Gateway Resources
  # =================================================================
  CxResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref CoreApiRootResourceId
      PathPart: 'cx'

  PublicResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref CoreApiRootResourceId
      PathPart: 'public'

  WebIntegrationResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref PublicResource
      PathPart: 'web-integration'

  MessagesPollResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref PublicResource
      PathPart: 'messages-poll'
  
  PublicSessionResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref PublicResource
      PathPart: 'session'

  PublicSessionOptionsApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref PublicSessionResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-Target,ApiKey,apikey,Prefer,X-Shared-Token'"
            ResponseTemplates:
              application/json: ""
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  ChatResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref CxResource
      PathPart: 'chat'

  ConnectInstancesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref CxResource
      PathPart: 'connect-instances'

  ConnectInstancesListResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref ConnectInstancesResource
      PathPart: 'list'
  
  ChannelResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref CxResource
      PathPart: 'channel'

  ChannelQuestionResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref ChannelResource
      PathPart: 'question'

# TODO: Need to resolve true way for naming resources
  AiAgentResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref CxResource
      PathPart: 'ai-agent'

  AiAgentsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref CxResource
      PathPart: 'ai-agents'

  AiAgentsActionGroupsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref AiAgentsResource
      PathPart: 'action-groups'

  AiAgentsActionGroupsListResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref AiAgentsActionGroupsResource
      PathPart: 'list'

  AiAgentsKnowledgeBaseResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref AiAgentsResource
      PathPart: 'knowledge-base'

  AiAgentsKnowledgeBaseListResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref AiAgentsKnowledgeBaseResource
      PathPart: 'list'

  LiveChatResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref WebhookResourceId
      PathPart: 'live-chat'

  CollaboratorResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref AiAgentsResource
      PathPart: 'collaborator'

  CollaboratorListResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref CollaboratorResource
      PathPart: 'list'

  ChatMessagesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref PublicResource
      PathPart: 'chat_messages'

  ChatMessagesRatingResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref ChatMessagesResource
      PathPart: 'rating'

  ChatMessagesFeedbackResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref ChatMessagesResource
      PathPart: 'feedback'

  ChatSessionsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref PublicResource
      PathPart: 'chat_sessions'

  ChatSessionsRatingResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref ChatSessionsResource
      PathPart: 'rating'

  ChatSessionsFeedbackResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref ChatSessionsResource
      PathPart: 'feedback'

  ChatMessagesReportResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref ChatMessagesResource
      PathPart: 'report'

  DashboardResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref CxResource
      PathPart: 'dashboard'

  MetricsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref DashboardResource
      PathPart: 'metrics'

  # =================================================================
  # SQS Response Analyst
  # =================================================================

  ResponseAnalysisQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 900
      QueueName: !Sub "f2-cx-response-analysis-queue-${Environment}.fifo"
      FifoQueue: true
      ContentBasedDeduplication: true

  ResponseAnalystLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-cx-sqs-response-analyst-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy
      Policies:
        - PolicyName: !Sub 'f2-model-invoke-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
        - PolicyName: !Sub 'f2-sqs-subscribe-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ResponseAnalysisQueue.Arn

  ResponseAnalystLambda:
    Type: AWS::Lambda::Function
    DependsOn: ResponseAnalysisQueue
    Properties:
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt ResponseAnalystLambdaRole.Arn
      FunctionName: !Sub 'f2-cx-sqs-response-analyst-${Environment}'
      Code: ../../lambda-dist/cx-sqs-response-analyst
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          DB_API_URL: !Ref DatabaseApiUrl
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup

  ResponseAnalysisQueueLambdaTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      Enabled: true
      EventSourceArn: !GetAtt ResponseAnalysisQueue.Arn
      FunctionName: !GetAtt ResponseAnalystLambda.Arn
    DependsOn:
      - ResponseAnalystLambda

  # =================================================================
  # WebSocket Server
  # =================================================================

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'f2-ws-${Environment}'
      Description: 'WebSocket API for f2 application'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.type'

  WebSocketHandlerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-cx-websocket-handler-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy
      Policies:
        - PolicyName: !Sub 'f2-lambda-websocket-access-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: execute-api:ManageConnections
                Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${WebSocketApiStage}/POST/@connections/*'

  WebSocketHandlerLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt WebSocketHandlerLambdaRole.Arn
      FunctionName: !Sub 'f2-cx-websocket-handler-${Environment}'
      Code: ../../lambda-dist/cx-websocket-handler
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          DB_API_URL: !Ref DatabaseApiUrl
          WEBSOCKET_URL: !Sub '${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret

  WebSocketHandlerLambdaPermission:
    Type: AWS::Lambda::Permission
    DependsOn: WebSocketHandlerLambda
    Properties:
      Action: lambda:invokeFunction
      FunctionName: !GetAtt "WebSocketHandlerLambda.Arn"
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WebSocketApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketHandlerLambda.Arn}/invocations"

  WebSocketApiConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: '$connect'
      Target: !Sub "integrations/${WebSocketApiIntegration}"

  WebSocketApiDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: '$disconnect'
      Target: !Sub "integrations/${WebSocketApiIntegration}"

  WebSocketApiPingRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: 'ping'
      Target: !Sub "integrations/${WebSocketApiIntegration}"

  WebSocketApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${WebSocketApi}/access-logs'
      RetentionInDays: 365

  WebSocketApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: !Ref Environment
      ApiId: !Ref WebSocketApi
      AutoDeploy: true
#      AccessLogSettings:
#        DestinationArn: !GetAtt WebSocketApiAccessLogGroup.Arn
#        Format: !Join
#          - ''
#          - - '{"requestId":"$context.requestId",'
#            - '"ip":"$context.identity.sourceIp",'
#            - '"user":"$context.identity.user",'
#            - '"requestTime":"$context.requestTime",'
#            - '"routeKey":"$context.routeKey",'
#            - '"status":"$context.status",'
#            - '"connectionId":"$context.connectionId",'
#            - '"messageId":"$context.messageId",'
#            - '"eventType":"$context.eventType",'
#            - '"duration":"$context.integration.latency",'
#            - '"error":"$context.error.message",'
#            - '"authError":"$context.authorizer.error"}'
#      DefaultRouteSettings:
#        LoggingLevel: INFO

  # =================================================================
  # WebSocket Connections Pruner
  # =================================================================

  WebSocketPrunerCronLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-cx-websocket-pruner-cron-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy

  WebSocketPrunerCronLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt WebSocketPrunerCronLambdaRole.Arn
      FunctionName: !Sub 'f2-cx-websocket-pruner-cron-${Environment}'
      Code: ../../lambda-dist/cx-websocket-pruner-cron
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup
      MemorySize: 512
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          DB_API_URL: !Ref DatabaseApiUrl
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret

  WebSocketPrunerCronLambdaConfig:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: WebSocketPrunerCronLambda
    Properties:
      FunctionName: !Ref WebSocketPrunerCronLambda
      MaximumRetryAttempts: 0
      Qualifier: $LATEST

  WebSocketPrunerScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-cx-websocket-pruner-schedule-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt WebSocketPrunerCronLambda.Arn

  WebSocketPrunerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: 'f2-cx-websocket-pruner-daily'
      GroupName: !Ref CxScheduleGroup
      ScheduleExpression: 'cron(0 1 * * ? *)'
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt WebSocketPrunerCronLambda.Arn
        RoleArn: !GetAtt WebSocketPrunerScheduleRole.Arn

  # =================================================================
  # /public/ws-init
  # =================================================================

  PublicWsInitResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref PublicResource
      PathPart: 'ws-init'

  PublicWsInitOptionsApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref PublicWsInitResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-Target,ApiKey,apikey,Prefer,X-Shared-Token'"
            ResponseTemplates:
              application/json: ""
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  WebSocketInitLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-cx-websocket-init-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy

  WebSocketInitLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt WebSocketInitLambdaRole.Arn
      FunctionName: !Sub 'f2-cx-websocket-init-${Environment}'
      Code: ../../lambda-dist/cx-websocket-init
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          WEBSOCKET_URL: !Sub '${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret

  PublicWsInitPostApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref PublicWsInitResource
      HttpMethod: POST
      ApiKeyRequired: true
      AuthorizationType: 'NONE'
      Integration:
        Type: AWS_PROXY
        Credentials: !Ref ApiGatewayLambdaExecutionRole
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction}/invocations
          - LambdaFunction: !GetAtt WebSocketInitLambda.Arn

  # =================================================================
  # 2. WebIntegration Lambda
  # =================================================================
  WebIntegrationLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt WebIntegrationLambdaRole.Arn
      FunctionName: !Sub 'f2-cx-web-integration-${Environment}'
      Code: ../../lambda-dist/cx-web-integration
      MemorySize: 512
      Timeout: 30
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup
      Environment:
        Variables:
          DB_API_URL: !Ref DatabaseApiUrl
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret
          REQUEST_PROCESSING_ARN: !GetAtt RequestProcessingLambda.Arn

  OptionsWebIntegrationApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref WebIntegrationResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-Target,ApiKey,apikey,Prefer,X-Shared-Token'"
            ResponseTemplates:
              application/json: ""
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  WebIntegrationLambdaPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref WebIntegrationResource
      HttpMethod: POST
      ApiKeyRequired: true
      AuthorizationType: 'NONE'
      Integration:
        Type: AWS_PROXY
        Credentials: !Ref ApiGatewayLambdaExecutionRole
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction}/invocations
          - LambdaFunction: !GetAtt WebIntegrationLambda.Arn

  # TODO: Do add invoke permissions for all lambda functions or use Role for AWS API Gateway?
  # WebIntegrationLambdaApiInvokePermission:
  #   Type: AWS::Lambda::Permission
  #   Properties:
  #     FunctionName: !Ref WebIntegrationLambda
  #     Action: lambda:InvokeFunction
  #     Principal: apigateway.amazonaws.com
  #     SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CoreApi}/*/POST/public/web-integration

  WebIntegrationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-cx-web-integration-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy
      Policies:
        - PolicyName: !Sub 'f2-Lambda-Invoke-Policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RequestProcessingLambda.Arn

  # =================================================================
  # 3. MessagesPoll Lambda
  # =================================================================
  MessagesPollLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt MessagesPollLambdaRole.Arn
      FunctionName: !Sub 'f2-cx-poll-messages-integration-${Environment}'
      Code: ../../lambda-dist/cx-poll-messages-integration
      MemorySize: 512
      Timeout: 30
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup
      Environment:
        Variables:
          APP_NAME: f2
          ENV: !Ref Environment
          ACCOUNT_ID: !Ref AWS::AccountId

  OptionsMessagesPollApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref MessagesPollResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
