              !Select [ 1, !Split [ "/", !Ref ApiGatewayLambdaExecutionRole ] ]

  # =================================================================
  # 22. Public Key and Usage plan fot API
  # =================================================================
  PublicApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Enabled: true
      Name: !Sub 'f2--cx-public-api-key-${Environment}'

  PublicUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub 'f2-cx-public-usage-plan-${Environment}'
      Description: !Sub 'Used by f2 for getting public access without jwt auth in ${Environment}'
      ApiStages:
        - ApiId: !Ref CoreApi
          Stage: !Ref ApiGatewayStage
      Quota:
        Limit: 10000
        Period: DAY
      Throttle:
        BurstLimit: 20
        RateLimit: 10

  PublicUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyType: API_KEY
      KeyId: !Ref PublicApiKey
      UsagePlanId: !Ref PublicUsagePlan

  # =================================================================
  # 23 AiAgentPostLambda Lambda
  # =================================================================
  BedrockAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-cx-agent-bedrock-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub 'f2-lambda-Secret-manager-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'bedrock:InvokeModel'
                  - 'bedrock:InvokeModelWithResponseStream'
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/*
              - Effect: Allow
                Action:
                  - 'bedrock:InvokeModel'
                  - 'bedrock:InvokeModelWithResponseStream'
                  - 'bedrock:GetInferenceProfile'
                  - 'bedrock:GetFoundationModel'
                Resource:
                  - !Sub arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
              - Effect: Allow
                Action:
                  - 'bedrock:Retrieve'
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
              - Effect: Allow
                Action:
                  - 'bedrock:GetAgentAlias'
                  - 'bedrock:InvokeAgent'
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/*

  AiAgentPostLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt AiAgentPostLambdaRole.Arn
      FunctionName: !Sub 'f2-cx-ai-agent-post-${Environment}'
      Code: ../../lambda-dist/cx-ai-agent-post
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          APP_NAME: f2
          ENV: !Ref Environment
          DB_API_URL: !Ref DatabaseApiUrl
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret
          BEDROCK_AGENT_ROLE_ARN: !GetAtt BedrockAgentRole.Arn

  AiAgentPostLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-cx-ai-agent-post-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy
      Policies:
        - PolicyName: !Sub 'f2-cx-bedrock-Policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'bedrock:CreateAgent'
                  - 'bedrock:CreateAgentAlias'
                  - 'bedrock:PrepareAgent'
                  - 'bedrock:GetAgentAlias'
                  - 'bedrock:GetAgent'
                Resource: '*' # !FIXME: '*' should be replaced
              - Effect: Allow
                Action:
                  - 'iam:PassRole'
                Resource: 
                  - !GetAtt BedrockAgentRole.Arn

  OptionsAiAgentMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref AiAgentResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,PUT,GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-Target,ApiKey,apikey,Prefer,X-Shared-Token'"
            ResponseTemplates:
              application/json: ""
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  AiAgentPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref AiAgentResource
      HttpMethod: POST
      ApiKeyRequired: false
      AuthorizationType: 'CUSTOM'
      AuthorizerId: !Ref JwtTokenAuthorizer
      Integration:
        Type: AWS_PROXY
        Credentials: !Ref ApiGatewayLambdaExecutionRole
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction}/invocations
          - LambdaFunction: !GetAtt AiAgentPostLambda.Arn

  # =================================================================
  # 23 AiAgentPutLambda Lambda
  # =================================================================

  AiAgentPutLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt AiAgentPutLambdaRole.Arn
      FunctionName: !Sub 'f2-cx-ai-agent-put-${Environment}'
      Code: ../../lambda-dist/cx-ai-agent-put
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          APP_NAME: f2
          ENV: !Ref Environment
          DB_API_URL: !Ref DatabaseApiUrl
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret
          BEDROCK_AGENT_ROLE_ARN: !GetAtt BedrockAgentRole.Arn

  AiAgentPutLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-cx-ai-agent-put-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy
      Policies:
        - PolicyName: !Sub 'f2-cx-bedrock-Policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'bedrock:UpdateAgent'
                  - 'bedrock:PrepareAgent'
                  - 'bedrock:UpdateAgentAlias'
                Resource: '*' # !FIXME: '*' should be replaced
              - Effect: Allow
                Action:
                  - 'iam:PassRole'
                Resource:
                  - !GetAtt BedrockAgentRole.Arn

  AiAgentPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref AiAgentResource
      HttpMethod: PUT
      ApiKeyRequired: false
      AuthorizationType: 'CUSTOM'
      AuthorizerId: !Ref JwtTokenAuthorizer
      Integration:
        Type: AWS_PROXY
        Credentials: !Ref ApiGatewayLambdaExecutionRole
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction}/invocations
          - LambdaFunction: !GetAtt AiAgentPutLambda.Arn
  
  # =================================================================
  # 24 AiAgentGetLambda Lambda
  # =================================================================

  AiAgentGetLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt AiAgentGetLambdaRole.Arn
      FunctionName: !Sub 'f2-cx-ai-agent-get-${Environment}'
      Code: ../../lambda-dist/cx-ai-agent-get
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          APP_NAME: f2
          ENV: !Ref Environment
          DB_API_URL: !Ref DatabaseApiUrl
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret

  AiAgentGetLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-cx-ai-agent-get-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy
      Policies:
        - PolicyName: !Sub 'f2-cx-bedrock-Policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'bedrock:GetAgent'
                Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*
              - Effect: Allow
                Action:
                  - 'bedrock:GetAgentAlias'
                Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/*

  AiAgentGetApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref AiAgentResource
      HttpMethod: GET
      ApiKeyRequired: false
      AuthorizationType: 'CUSTOM'
      AuthorizerId: !Ref JwtTokenAuthorizer
      Integration:
        Type: AWS_PROXY
        Credentials: !Ref ApiGatewayLambdaExecutionRole
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction}/invocations
          - LambdaFunction: !GetAtt AiAgentGetLambda.Arn
  
  # =================================================================
  # 25 AiAgentGetLambda Lambda
  # =================================================================

  ChatSessionCreatorLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt ChatSessionCreatorLambdaRole.Arn
      FunctionName: !Sub 'f2-cx-chat-session-creator-${Environment}'
      Code: ../../lambda-dist/cx-chat-session-creator
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          APP_NAME: f2
          ENV: !Ref Environment
          DB_API_URL: !Ref DatabaseApiUrl
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret

  ChatSessionCreatorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-cx-chat-session-creator-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy
      Policies:
        - PolicyName: !Sub 'f2-cx-sqs-create-queue-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:GetQueueUrl
                Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:*.fifo

  ChatSessionCreatorPostApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref PublicSessionResource
      HttpMethod: POST
      ApiKeyRequired: true
      AuthorizationType: 'NONE'
      Integration:
        Type: AWS_PROXY
        Credentials: !Ref ApiGatewayLambdaExecutionRole
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction}/invocations
          - LambdaFunction: !GetAtt ChatSessionCreatorLambda.Arn
  
  # =================================================================
  # 26. Outputs
  # =================================================================
Outputs:
  ApiMethods:
    Description: "The list of API methods"
    Value: !Join
      - ','
      - - !Ref WebIntegrationLambdaPostMethod
        - !Ref MessagesPollLambdaGetMethod
        - !Ref WebhookLiveChatLambdaPostMethod
        - !Ref ConnectInstancesListIntegrationLambdaGetMethod
        - !Ref AiAgentsActionGroupsGetMethod
        - !Ref AiAgentsActionGroupsListGetMethod
        - !Ref ChanelPostMethod
        - !Ref ChanelDeleteMethod
        - !Ref OptionsWebIntegrationApiMethod
        - !Ref OptionsMessagesPollApiMethod
        - !Ref OptionsChatMessagesRatingApiMethod
        - !Ref OptionsChatMessagesFeedbackApiMethod
        - !Ref OptionsChatSessionsRatingApiMethod
        - !Ref OptionsChatSessionsFeedbackApiMethod
        - !Ref OptionsChatMessagesReportApiMethod
        - !Ref OptionsWebhookLiveChatApiMethod
        - !Ref OptionsConnectInstancesListIntegrationApiMethod
        - !Ref OptionsAiAgentsActionGroupsApiMethod
        - !Ref OptionsAiAgentsActionGroupsListApiMethod
        - !Ref OptionsAiAgentApiMethod
        - !Ref OptionsAiAgentCollaboratorsListApiMethod
        - !Ref OptionsChanelApiMethod
  ModuleName:
    Value: !Ref ModuleName
