  # =================================================================
  # 8. IAM Roles
  # =================================================================
  BedrockExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub BedRock-f2-knowledge-base-role-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockExecutionRolePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/*
              - Effect: Allow
                Action: aoss:APIAccessAll
                Resource: !Sub arn:${AWS::Partition}:aoss:${AWS::Region}:${AWS::AccountId}:collection/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${PrivateBucketName}
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${PrivateBucketName}/${LlmDataSourcesFolder}/*
              - Effect: Allow
                Action:
                  - s3vectors:CreateVectorBucket
                  - s3vectors:CreateIndex
                  - s3vectors:GetIndex
                  - s3vectors:QueryVectors
                  - s3vectors:PutVectors
                  - s3vectors:GetVectors
                  - s3vectors:DeleteVectors
                Resource: !Sub arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/*

  # =================================================================
  # 9. Migration DB data for GA module
  # =================================================================
  MigrationScriptDbDateTrigger:
    Type: Custom::MigrationScriptTrigger
    Properties:
      ServiceTimeout: 70
      ServiceToken: !Ref MigrationDbScriptLambda
      module: !Ref ModuleName
      Version: !Ref Version

  # =================================================================
  # 11. Policy to access invoke lambdas from API Gateway
  # =================================================================
  AiModuleLambdaInvokePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: AiModuleLambdaInvokeManagedPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: 
              - !GetAtt LlmDataSourceDeleteLambda.Arn
              - !GetAtt LlmDataSourcePostLambda.Arn
              - !GetAtt LlmStructureProcessingPostLambda.Arn
              - !GetAtt LlmStructureNoFrameworkProcessingLambda.Arn
              - !GetAtt LlmStructurePostLambda.Arn
              - !GetAtt AiStructureModelListGetLambda.Arn
      Roles: 
        - !Sub 
          - "${RoleName}"
          - RoleName: 
              !Select [ 1, !Split [ "/", !Ref ApiGatewayLambdaExecutionRole ] ]

  # =================================================================
  # 12. LlmStructurePostLambda Lambda
  # =================================================================
  AiDataSourceCreatorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-ai-data-source-creator-${Environment}'
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Code: ../../lambda-dist/ai-data-source-creator
      Environment:
        Variables:
          APP_NAME: f2
          ENV: !Ref Environment
          ACCOUNT_ID: !Ref AWS::AccountId
          DB_API_URL: !Ref LoadBalancerLink
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret
          BEDROCK_KNOWLEDGE_BASE_ROLE_ARN: !GetAtt BedrockExecutionRole.Arn
          LAMBDA_DATA_SOURCE_ROLE_ARN: !GetAtt AiDataSourceCreatorLambdaRole.Arn
          BUCKET_ARN: !Sub "arn:${AWS::Partition}:s3:::${PrivateBucketName}"
          LLM_DATA_SOURCES_FOLDER: !Ref LlmDataSourcesFolder
      Layers:
        - !Ref CommonLayer
      Timeout: 900
      MemorySize: 512
      Role: !GetAtt AiDataSourceCreatorLambdaRole.Arn
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup

  AiDataSourceCreatorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-ai-data-source-creator-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy
      Policies:
        - PolicyName: !Sub 'f2-llm-data-source-post-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:DeleteKnowledgeBase
                  - bedrock:CreateKnowledgeBase
                  - bedrock:CreateDataSource
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*'
        - PolicyName: !Sub 'f2-ai-datasource-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'aoss:CreateAccessPolicy'
                  - 'aoss:CreateSecurityPolicy'
                  - 'aoss:CreateCollection'
                  - 'aoss:BatchGetCollection'
                  - 'aoss:DeleteCollection'
                  - 'aoss:DeleteAccessPolicy'
                  - 'aoss:DeleteSecurityPolicy'
                  - 'aoss:CreateIndex'
                Resource: '*'
        - PolicyName: !Sub 'f2-ai-dataSource-access-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'aoss:APIAccessAll'
                Resource: !Sub 'arn:aws:aoss:${AWS::Region}:${AWS::AccountId}:collection/*'
        - PolicyName: !Sub 'f2-ai-iam-pass-role-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'iam:PassRole'
                Resource:  !GetAtt BedrockExecutionRole.Arn
        - PolicyName: !Sub 'f2-ai-s3vectors-access-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3vectors:CreateVectorBucket'
                  - 's3vectors:CreateIndex'
                Resource: !Sub 'arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/*'

  # =================================================================
  # 13. Develop API Key and Usage plan
  # =================================================================
  DevelopmentApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Enabled: true
      Name: !Sub 'f2-ai-development-team-api-key-${Environment}'

  DevelopmentUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub 'f2-ai-development-team-usage-plan-${Environment}'
      Description: !Sub 'Used by f2 development team in ${Environment}'
      ApiStages:
        - ApiId: !Ref CoreApi
          Stage: !Ref ApiGatewayStage
      Quota:
        Limit: 1000
        Period: MONTH
      Throttle:
        BurstLimit: 20
        RateLimit: 10

  DevelopmentUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyType: API_KEY
      KeyId: !Ref DevelopmentApiKey
      UsagePlanId: !Ref DevelopmentUsagePlan

  # =================================================================
  # 14. Develop API Key and Usage plan
  # =================================================================
  AiStructureModelListGetLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-llm-structure-model-list-get-${Environment}'
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Code: ../../lambda-dist/llm-structure-model-list-get
      Layers:
        - !Ref CommonLayer
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          APP_NAME: f2
          ENV: !Ref Environment
      Role: !GetAtt AiStructureModelListGetLambdaRole.Arn
  
  AiStructureModelListGetLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-llm-structure-model-list-get-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockExecutionRolePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: 
                  - bedrock:ListFoundationModels
                  - bedrock:ListInferenceProfiles
                Resource: "*"

  # =================================================================
  # 14. Outputs
  # =================================================================
Outputs:
  ApiMethods:
    Description: "The list of API methods"
    Value: !Join
      - ','
      - - !Ref LlmDataSourceDeleteApiMethod
        - !Ref LlmDataSourcePostAPI
        - !Ref LlmStructureProcessingPostMethod
        - !Ref SharedLlmStructureProcessingPostMethod
        - !Ref LlmDataSourceGetMethod
        - !Ref LlmDataSourcePatchMethod
        - !Ref LlmRuleGetMethod
        - !Ref LlmRuleDeleteMethod
        - !Ref LlmRulePatchMethod
        - !Ref LlmStructureDeleteMethod
        - !Ref LlmStructureGetMethod
        - !Ref LlmStructureSharedTokenGetMethod
        - !Ref LlmStructureSharedTokenPatchMethod
        - !Ref LlmStructureSharedTokenPostMethod
        - !Ref LlmStructureSharedTokenDeleteMethod
        - !Ref LlmStructureModelListGetMethod
        - !Ref LlmDataSourceSyncPostMethod
        - !Ref LlmDataSourceSyncStatusGetMethod
        - !Ref LlmStructureOptionsApiMethod
        - !Ref LlmDataSourceOptionsApiMethod
        - !Ref LlmStructureProcessingOptionsApiMethod
        - !Ref SharedLlmStructureProcessingOptionsApiMethod
        - !Ref LlmRuleOptionsApiMethod
        - !Ref LLlmStructureSharedTokenOptionsApiMethod
        - !Ref LlmStructureModelListOptionsApiMethod
        - !Ref LlmDataSourceSyncOptionsApiMethod
        - !Ref LlmDataSourceSyncStatusOptionsApiMethod
  ModuleName:
    Value: !Ref ModuleName

