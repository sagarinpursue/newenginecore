    Properties:
      FunctionName: !Sub 'f2-llm-structure-no-framework-processing-${Environment}'
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Code: ../../lambda-dist/llm-structure-no-framework-processing
      Layers:
        - !Ref CommonLayer
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          APP_NAME: f2
          ENV: !Ref Environment
          DB_API_URL: !Ref LoadBalancerLink
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret
          ACCOUNT_ID: !Ref AWS::AccountId
          BUCKET_NAME: !Ref PrivateBucketName
          DATA_SOURCE_FOLDER: !Ref LlmDataSourcesFolder
      Role: !GetAtt LlmStructureNoFrameworkProcessingLambdaRole.Arn
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup

  LlmStructureNoFrameworkProcessingLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-llm-structure-no-framework-processing-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy
      Policies:
        - PolicyName: !Sub 'f2-llm-structure-no-framework-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:aws:s3:::${PrivateBucketName}/${LlmDataSourcesFolder}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${PrivateBucketName}'
              - Effect: Allow
                Action: bedrock:Retrieve
