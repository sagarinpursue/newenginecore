  SharedLlmStructureProcessingPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref SharedLlmStructureProcessingResource
      HttpMethod: POST
      ApiKeyRequired: true
