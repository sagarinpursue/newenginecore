  # =================================================================
  # 2. LlmDataSourceDelete Lambda
  # =================================================================
  LlmDataSourceDeleteLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-llm-data-source-delete-${Environment}'
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Code: ../../lambda-dist/llm-data-source-delete
      Layers:
        - !Ref CommonLayer
      Timeout: 30
      MemorySize: 512
      Role: !GetAtt LlmDataSourceDeleteLambdaRole.Arn
      Environment:
        Variables:
          APP_NAME: f2
          ENV: !Ref Environment
          DB_API_URL: !Ref LoadBalancerLink
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup

  LlmDataSourceDeleteApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: DELETE
      ResourceId: !Ref LlmDataSourceResource
      RestApiId: !Ref CoreApi
      ApiKeyRequired: false
      AuthorizationType: 'CUSTOM'
      AuthorizerId: !Ref JwtTokenAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Credentials: !Ref ApiGatewayLambdaExecutionRole
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LlmDataSourceDeleteLambda.Arn}/invocations"

  # LlmDataSourceDeleteApiPermission:
  #   Type: AWS::Lambda::Permission
  #   Properties:
  #     FunctionName: !GetAtt LlmDataSourceDeleteLambda.Arn
  #     Action: lambda:InvokeFunction
  #     Principal: apigateway.amazonaws.com
  #     SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CoreApi}/*/DELETE/llm-data-source'

  LlmDataSourceDeleteLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-llm-data-source-delete-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy
      Policies:
        - PolicyName: F2LlmDataSourceDeletePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:DeleteKnowledgeBase
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*'
        - PolicyName: !Sub 'f2-ai-datasource-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'aoss:DeleteCollection'
                  - 'aoss:DeleteAccessPolicy'
                  - 'aoss:DeleteSecurityPolicy'
                Resource: '*'
        - PolicyName: !Sub 'f2-ai-s3vectors-access-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3vectors:DeleteVectorBucket'
                  - 's3vectors:DeleteIndex'
                Resource: !Sub 'arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/*'

  # =================================================================
  # 3. LlmDataSourcePost Lambda
  # =================================================================
  LlmDataSourcePostLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'f2-llm-data-source-post-${Environment}'
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Code: ../../lambda-dist/llm-data-source-post
      Layers:
        - !Ref CommonLayer
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          APP_NAME: f2
          ENV: !Ref Environment
          DB_API_URL: !Ref LoadBalancerLink
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret
          AI_DATA_SOURCE_CREATOR_LAMBDA_NAME: !Ref AiDataSourceCreatorLambda
          LLM_DATA_SOURCES_FOLDER: !Ref LlmDataSourcesFolder
      Role: !GetAtt LlmDataSourcePostLambdaRole.Arn
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup

  LlmDataSourcePostAPI:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref LlmDataSourceResource
      HttpMethod: POST
      ApiKeyRequired: false
      AuthorizationType: 'CUSTOM'
      AuthorizerId: !Ref JwtTokenAuthorizer
      Integration:
        Type: AWS_PROXY
        Credentials: !Ref ApiGatewayLambdaExecutionRole
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !GetAtt LlmDataSourcePostLambda.Arn

  # LlmDataSourcePostLambdaPermission:
  #   Type: AWS::Lambda::Permission
  #   Properties:
  #     FunctionName: !GetAtt LlmDataSourcePostLambda.Arn
  #     Action: lambda:InvokeFunction
  #     Principal: apigateway.amazonaws.com
  #     SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CoreApi}/*/POST/llm-data-source'

  LlmDataSourcePostLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-llm-data-source-post--lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref JwtAuthorizerSecretGetPolicy
      Policies:
        - PolicyName: !Sub 'f2-ai-invoke-data-source-creator-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AiDataSourceCreatorLambda.Arn
        - PolicyName: !Sub 'f2-ai-import-data-source-policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:GetKnowledgeBase
                  - bedrock:ListDataSources
                  - bedrock:GetDataSource
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*'

