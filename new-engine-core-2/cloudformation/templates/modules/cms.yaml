AWSTemplateFormatVersion: 2010-09-09
Description: CMS module

Parameters:
  Environment:
    Type: String
  CoreApi:
    Type: String
  CoreApiRootResourceId:
    Type: String
  JwtTokenAuthorizer:
    Type: String
  DatabaseApiUrl:
    Type: String
  JwtAuthorizerSecret:
    Type: String
  JwtAuthorizerSecretGetPolicy:
    Type: String
  CoreBucket:
    Type: String
  CoreBucketCmsTempFolder:
    Type: String
    Default: cms-temporary-documents

  LambdaRuntime:
    Type: String
    Default: nodejs22.x
  CommonLayer:
    Type: String
  ApiGatewayLambdaExecutionRole:
    Type: String

  CoreVPC:
    Type: String
  PrivateSubnetIds:
    Type: CommaDelimitedList
  SecurityGroup:
    Type: String

  MigrationDbScriptLambda:
    Type: String
  ModuleName:
    Type: String
    Default: cms-module
  Version:
    Type: String
    Default: '1.0.0'
  
  EmptyS3BucketLambda: 
    Type: String
  EmptyS3BucketLambdaRole:
    Type: String

# TODO: add hot links in the documentation to resources in templates
Resources:
  # =================================================================
  # 1. CMS bucket
  # =================================================================
  CmsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 
        - 'f2-cms-${UniqueId}-${Environment}'
        - UniqueId: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      AccessControl: Private
      VersioningConfiguration:
        Status: 'Enabled'

  # =================================================================
  # 2. Api Gateway Resources
  # =================================================================
  CmsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref CoreApiRootResourceId
      PathPart: 'cms'

  DocumentsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CoreApi
      ParentId: !Ref CmsResource
      PathPart: 'documents'

  # AnalysisReportsResource:
