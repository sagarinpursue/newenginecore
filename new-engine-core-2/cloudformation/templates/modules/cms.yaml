  #     SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CoreApi}/*/POST/cms/documents/generate-pre-signed-urls

  DocumentGeneratePreSignUrlsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-cms-document-generate-pre-signed-urls-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: !Sub 'f2-Lambda-S3-Integration-Policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub 'arn:aws:s3:::${CoreBucket}/${CoreBucketCmsTempFolder}/*'

  # =================================================================
  # 6. CmsDocumentFinishUploadingFiles Lambda
  # =================================================================
  DocumentFinishUploadingFilesLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt DocumentFinishUploadingFilesLambdaRole.Arn
      FunctionName: !Sub 'f2-cms-document-finish-uploading-files-${Environment}'
      Code: ../../lambda-dist/cms-document-finish-uploading-files
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          DB_API_URL: !Ref DatabaseApiUrl
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret
          APP_NAME: f2
          ENV: !Ref Environment
          CMS_BUCKET: !Ref CmsBucket
          CORE_BUCKET: !Ref CoreBucket
          CMS_TEMP_FOLDER: !Ref CoreBucketCmsTempFolder

  DocumentFinishUploadingFilesLambdaPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref FinishUploadingFilesResource
      HttpMethod: POST
      ApiKeyRequired: false
      AuthorizationType: 'CUSTOM'
      AuthorizerId: !Ref JwtTokenAuthorizer
      Integration:
        Type: AWS_PROXY
        Credentials: !Ref ApiGatewayLambdaExecutionRole
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction}/invocations
          - LambdaFunction: !GetAtt DocumentFinishUploadingFilesLambda.Arn

  # TODO: Do add invoke permissions for all lambda functions or use Role for AWS API Gateway?
  # DocumentFinishUploadingFilesLambdaApiInvokePermission:
  #   Type: AWS::Lambda::Permission
  #   Properties:
  #     FunctionName: !Ref DocumentFinishUploadingFilesLambda
  #     Action: lambda:InvokeFunction
  #     Principal: apigateway.amazonaws.com
  #     SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CoreApi}/*/POST/cms/documents/finish-uploading-files

  DocumentFinishUploadingFilesLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-cms-document-finish-uploading-files-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !Ref JwtAuthorizerSecretGetPolicy
      Policies:
        - PolicyName: !Sub 'f2-Lambda-S3-Integration-Policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${CoreBucket}/${CoreBucketCmsTempFolder}/*'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:aws:s3:::${CmsBucket}/*'

  # =================================================================
  # 7. CmsDocumentListGet Lambda
  # =================================================================
  DocumentListGetLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt DocumentListGetLambdaRole.Arn
      FunctionName: !Sub 'f2-cms-document-list-get-${Environment}'
      Code: ../../lambda-dist/cms-document-list-get
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          DB_API_URL: !Ref DatabaseApiUrl
          JWT_AUTHORIZER_SECRET: !Ref JwtAuthorizerSecret
          APP_NAME: f2
          ENV: !Ref Environment
          CMS_BUCKET: !Ref CmsBucket

  DocumentListGetLambdaGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref DocumentsListResource
      HttpMethod: GET
      ApiKeyRequired: false
      AuthorizationType: 'CUSTOM'
      AuthorizerId: !Ref JwtTokenAuthorizer
      Integration:
        Type: AWS_PROXY
        Credentials: !Ref ApiGatewayLambdaExecutionRole
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction}/invocations
          - LambdaFunction: !GetAtt DocumentListGetLambda.Arn

  # TODO: Do add invoke permissions for all lambda functions or use Role for AWS API Gateway?
  # DocumentListGetLambdaApiInvokePermission:
  #   Type: AWS::Lambda::Permission
  #   Properties:
  #     FunctionName: !Ref DocumentListGetLambda
  #     Action: lambda:InvokeFunction
  #     Principal: apigateway.amazonaws.com
  #     SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CoreApi}/*/GET/cms/documents/list

  DocumentListGetLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'f2-cms-document-list-get-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !Ref JwtAuthorizerSecretGetPolicy
      Policies:
        - PolicyName: !Sub 'f2-Lambda-S3-Integration-Policy-${Environment}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${CmsBucket}/*'

  # =================================================================
  # 8. Policy to access invoke lambdas from API Gateway
  # =================================================================
  CmsModuleLambdaInvokePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: CmsModuleLambdaInvokeManagedPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: 
              - !GetAtt DocumentListGetLambda.Arn
              - !GetAtt DocumentFinishUploadingFilesLambda.Arn
              - !GetAtt DocumentGeneratePreSignUrlsLambda.Arn
              # - !GetAtt DocumentQuestionGeneratorLambda.Arn
              # - !GetAtt ChunkDuplicateConflictDetectorLambda.Arn

      Roles: 
        - !Sub 
          - "${RoleName}"
          - RoleName: 
              !Select [ 1, !Split [ "/", !Ref ApiGatewayLambdaExecutionRole ] ]

  # =================================================================
  # 9. Migration DB data for GA module
  # =================================================================
  MigrationScriptDbDateTrigger:
    Type: Custom::MigrationScriptTrigger
    Properties:
      ServiceTimeout: 70
      ServiceToken: !Ref MigrationDbScriptLambda
      module: !Ref ModuleName
      Version: !Ref Version

  # =================================================================
  # Policy to access to empty cms s3 bucket
  # =================================================================
  CmsModuleEmptyS3BucketPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub 'f2-empty-cms-s3-bucket-role-policy-${Environment}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketVersioning
              - s3:DeleteObjectVersion
              - s3:ListBucketVersions
            Resource: 
              - !GetAtt CmsBucket.Arn
              - !Sub "${CmsBucket.Arn}/*"

      Roles: 
        - !Sub 
          - "${RoleName}"
          - RoleName: 
              !Select [ 1, !Split [ "/", !Ref EmptyS3BucketLambdaRole ] ]

  # =================================================================
  # Empty cms s3 bucket
  # =================================================================
  EmptyCmsS3Bucket:
    Type: Custom::EmptyCmsS3Bucket
    Properties:
      ServiceToken: !Ref EmptyS3BucketLambda
      BucketName: !Ref CmsBucket

  # =================================================================
  # 25. Outputs
  # =================================================================
Outputs:
  ModuleName:
    Value: !Ref ModuleName