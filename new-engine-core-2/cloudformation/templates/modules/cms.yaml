  # =================================================================
  # 5. CmsDocumentGeneratePreSignUrls Lambda
  # =================================================================
  DocumentGeneratePreSignUrlsLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt DocumentGeneratePreSignUrlsLambdaRole.Arn
      FunctionName: !Sub 'f2-cms-document-generate-pre-signed-urls-${Environment}'
      Code: ../../lambda-dist/cms-document-generate-pre-signed-urls
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroup
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          APP_NAME: f2
          ENV: !Ref Environment
          CORE_BUCKET: !Ref CoreBucket
          CMS_TEMP_FOLDER: !Ref CoreBucketCmsTempFolder

  DocumentGeneratePreSignUrlsLambdaPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CoreApi
      ResourceId: !Ref GeneratePreSignUrlsResource
      HttpMethod: POST
      ApiKeyRequired: false
      AuthorizationType: 'CUSTOM'
      AuthorizerId: !Ref JwtTokenAuthorizer
      Integration:
        Type: AWS_PROXY
        Credentials: !Ref ApiGatewayLambdaExecutionRole
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction}/invocations
          - LambdaFunction: !GetAtt DocumentGeneratePreSignUrlsLambda.Arn

  # TODO: Do add invoke permissions for all lambda functions or use Role for AWS API Gateway?
  # DocumentGeneratePreSignUrlsLambdaApiInvokePermission:
